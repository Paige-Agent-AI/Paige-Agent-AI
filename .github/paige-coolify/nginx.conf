worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format timing '$request_method $status $request_time';
    access_log /dev/stdout timing;
    server_tokens off;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    map "$status:$uri" $cache_control {
        ~^(200|206|304):/assets/ "public, max-age=31536000, immutable";
        ~^(200|206|304):/embed\.js$ "public, max-age=300, must-revalidate";
        default "no-cache, no-store, must-revalidate";
    }

    map $host $robots {
        ~\.sslip\.io$ "noindex, nofollow";
        default "";
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        add_header Cache-Control $cache_control always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Robots-Tag $robots always;
        add_header Content-Security-Policy "default-src 'self' https: data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' https: wss:; frame-src 'self' https:; media-src 'self' https: data: blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self' https:" always;

        if ($request_method !~ ^(GET|HEAD)$) { return 405; }

        location = /healthz {
            access_log off;
            default_type text/plain;
            if (!-f $document_root/auth.html) { return 503; }
            return 200 "ok\n";
        }

        location = /auth { try_files /auth.html =404; }
        location = /privacy { try_files /privacy.html =404; }
        location = /sms-terms { try_files /sms-terms.html =404; }
        location = /release.json { try_files $uri =404; }
        location = /version.json { try_files $uri =404; }
        location = /sw.js { try_files $uri =404; }
        location = /embed.js { try_files $uri =404; }
        location ^~ /assets/ { try_files $uri =404; }
        location / { try_files $uri /index.html; }
    }
}
