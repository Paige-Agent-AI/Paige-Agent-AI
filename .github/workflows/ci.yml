# ci — the frontend quality gate that did not exist before (PLATFORM_ASSESSMENT Move 4).
#
# Until this, CI ran only migration-lint + `npm audit`. There was no typecheck, no build, no
# test, no lint gate — doctrine was enforced by intention, which does not scale to a repo this
# size. This adds the real gate: build + tests are hard, type errors ratchet (no NEW ones), and
# added lines must pass the §3+jargon+policy regression lint / changed files must pass eslint +
# gold-discipline. Existing baselines (pre-existing tsc errors; §3 copy in shipped files owned by
# the §2/§3 cleanup lanes; immutable past migrations) are handled by ratchet/added-lines-only so
# this gate is green on main from day one and actually gets respected instead of ignored.
#
# NOTE (§18 seam): migration linting lives in migration-lint.yml (lint_migrations.py). This gate's
# only migration touch is the regression check for a NEW non-restrictive `USING/WITH CHECK(false)`
# policy — a class lint_migrations.py does not cover, so no duplication. Keep new migration checks
# in ONE of these two, not a third.
#
# NOTE (required check): a workflow only BLOCKS merges when it's a required status check in branch
# protection — which can't be set from code. The owner must mark `ci / verify` required in
# Settings → Branches for this to gate, otherwise it is advisory. See docs/OPS.md.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  # Manual exact-ref run (§24 CI reliability). A bot-authored PR's `pull_request` and `push`
  # events are withheld from Actions (recursion prevention), so such a PR can never earn a real
  # CI run from its own events. This lets the EXISTING gate be dispatched against an exact ref;
  # the changed-file/edge gates below resolve their base from the live `origin/main` tip so the
  # SAME checks run — no check is weakened, skipped, replaced, or de-required. PR/push behaviour
  # is UNCHANGED: every event-conditional below still evaluates identically for those two events
  # (the new `workflow_dispatch` branch only activates on a manual dispatch).
  workflow_dispatch:

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need base-sha history for changed-files diffs + the tsc ratchet

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          # `cache: npm` keys on the committed package-lock.json. Both this and `npm ci` below were
          # previously impossible because no package-lock.json was committed; it now is.
          # NOTE: bun.lockb remains the lockfile PRODUCTION installs from (vercel.json pins
          # `installCommand: bun install`), so this npm lane governs CI only. Converging the two
          # lockfiles, or moving CI to bun for prod-build fidelity, is a tracked follow-up.
          cache: npm

      - name: Install
        # PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: CI never launches a browser (the live-drive helper +
        # scripts/live-drive run only in a capable session, not in ci.yml), so the `playwright`
        # devDep must NOT pull ~150MB of Chromium on every install. A dev machine deliberately does
        # NOT set this, so a local `npm install` still fetches Playwright's own bundled browser for
        # running live-drive. (scoped to CI, not global — see scripts/live-drive/README.md.)
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        # `npm ci`, not `npm install`: it installs the exact tree the committed lockfile records and
        # FAILS if package.json and the lockfile disagree, instead of silently re-resolving. That
        # re-resolution is what let an upstream unpublish (@splinetool/animation-core) break every
        # branch's install at once — CI could not have been pinned to a known-good tree.
        run: npm ci --no-audit --no-fund

      # --- Changed-file gates (PR only — a push to main has no PR base). Cheap checks first. -----
      # Compute the MERGE-BASE once and diff against it, not the raw base-branch tip. base.sha is
      # the CURRENT main tip; a stale PR branch cut from an older main re-surfaces files sibling
      # PRs have since deleted (they read as Added vs current-main) and the changed-file gates then
      # lint code that no longer exists on main — a false failure (F10: AppSidebar/Dashboard). The
      # merge-base is where the branch actually forked, so the diff is exactly what THIS PR changed;
      # fetch-depth:0 makes it resolvable. All three gates below share this one base.
      - name: Compute merge-base
        id: mergebase
        if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') }}
        env:
          EV: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EV" = "pull_request" ]; then
            BASE="$PR_BASE"; HEAD="$PR_HEAD"
          else
            # workflow_dispatch: diff the dispatched ref against the CURRENT main tip. fetch-depth:0
            # fetches only the checked-out ref's history, so main is fetched explicitly here.
            git fetch --no-tags origin main
            BASE="$(git rev-parse FETCH_HEAD)"; HEAD="$GITHUB_SHA"
          fi
          mb="$(git merge-base "$BASE" "$HEAD")"
          echo "mb=$mb" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD" >> "$GITHUB_OUTPUT"
          echo "merge-base(base=$BASE, head=$HEAD) = $mb"

      - name: Compute changed files
        id: changed
        if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') }}
        env:
          BASE: ${{ steps.mergebase.outputs.mb }}
          HEAD: ${{ steps.mergebase.outputs.head }}
        run: |
          # AMR: include Renamed files (a rename+edit must still be linted). Same base/head the
          # regression lint uses, so the two gates never disagree about the change set.
          all="$(git diff --name-only --diff-filter=AMR "$BASE" "$HEAD" || true)"
          src="$(echo "$all" | grep -E '^src/.*\.(ts|tsx)$' || true)"
          echo "src_count=$(printf '%s' "$src" | grep -c . || true)" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$src" | grep -E '.' > changed_src.txt || true
          # Impeccable reads stylesheets as well as components, so its change set is wider
          # than the ESLint one. Same base/head, so the two gates never disagree.
          ui="$(echo "$all" | grep -E '^src/.*\.(ts|tsx|css)$' || true)"
          echo "ui_count=$(printf '%s' "$ui" | grep -c . || true)" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$ui" | grep -E '.' > changed_ui.txt || true
          echo "Changed src files:"; cat changed_src.txt || true
          # Edge functions are a SEPARATE tree that tsc never sees (they are Deno, not Vite).
          fns="$(echo "$all" | grep -E '^supabase/functions/.*\.ts$' || true)"
          echo "fn_count=$(printf '%s' "$fns" | grep -c . || true)" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$fns" | grep -E '.' > changed_fns.txt || true
          echo "Changed edge-function files:"; cat changed_fns.txt || true

      - name: tsc baseline may only shrink
        if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') }}
        env:
          BASE: ${{ steps.mergebase.outputs.mb }}
        run: node scripts/ci/baseline-guard.mjs

      - name: Regression lint (§3 phrases · jargon · non-restrictive policy — added lines)
        if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') }}
        env:
          BASE_REF: ${{ steps.mergebase.outputs.mb }}
          HEAD_REF: ${{ steps.mergebase.outputs.head }}
        run: npm run ci:regression

      - name: View security_invoker guard (§9/§30 — public views must not bypass RLS)
        if: ${{ !cancelled() }}
        run: npm run lint:views

      - name: Live-drive proxy bypass stays loopback-only (dev harness must never bypass a remote host)
        if: ${{ !cancelled() }}
        run: npm run harness:proxy-bypass

      - name: SECURITY DEFINER fn anon-grant guard (§9/§37 #117 — DEFINER fns must not be anon/PUBLIC-callable)
        if: ${{ !cancelled() }}
        run: npm run lint:definer-fns

      # Two migrations sharing a version means production applies only one of them: the
      # deploy-migrations push refuses or skips the other, and its objects never exist. Two PRs can
      # each pass alone and collide only once both are on main (2026-10-04: #1679 and #1680 both
      # merged 20270539000000), so this runs on every push to main as well as every PR.
      - name: Migration version collision guard (two files may never share a version)
        if: ${{ !cancelled() }}
        run: npm run lint:migration-versions

      - name: Migration version collision guard self-test
        if: ${{ !cancelled() }}
        run: npm run lint:migration-versions:test

      - name: Raw-Rail browser-grant guard (§9/§58 #746 — the browser reads the Rail via resolvers, never the table)
        if: ${{ !cancelled() }}
        run: npm run lint:rail-grants

      - name: Raw-Rail browser-grant guard self-test
        if: ${{ !cancelled() }}
        run: npm run lint:rail-grants:test

      - name: Authority guard (no service-role work or provider traffic before the caller is authorized)
        if: ${{ !cancelled() }}
        run: npm run lint:action-authority

      - name: Credential-shadow guard (one representation per credential; rotation must reach the auth)
        if: ${{ !cancelled() }}
        run: npm run lint:no-shadowed-credential

      - name: User-facing URL guard (/admin is an inbound compatibility route, never an outbound destination)
        if: ${{ !cancelled() }}
        run: npm run lint:user-facing-admin-urls

      - name: SSRF fork guard (§18 — one address validator; use _shared/ssrfGuard.ts safeFetch)
        if: ${{ !cancelled() }}
        run: npm run lint:ssrf-fork

      - name: Secure Browser prerequisite security contract (tenant attribution, JWT authority, gated worker, read-only egress)
        if: ${{ !cancelled() }}
        run: npm run smoke:secure-browser-security

      - name: Secure Browser provider-neutral control plane (RLS, receipts, limits, quarantine, hard provider gates)
        if: ${{ !cancelled() }}
        run: npm run smoke:secure-browser-control-plane

      - name: Install Chromium for the Secure Browser hostile-page proof
        if: ${{ !cancelled() }}
        run: npx playwright install --with-deps chromium

      - name: Secure Browser hostile-page egress proof (reads pass; writes, beacon, WebSockets, service workers stop)
        if: ${{ !cancelled() }}
        run: npm run smoke:secure-browser-egress

      # paige-browser /render (§33 screenshots): the REAL render.mjs against real Chromium, plus the
      # real server.js refusal paths over HTTP. express is a service-only dependency, so it is
      # installed into the service folder here (no lockfile written) — without it the HTTP leg would
      # print SKIP, never pass silently.
      - name: paige-browser /render capture proof (slices, payload isolation, honest failures, refusals)
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          npm install --prefix services/paige-browser --omit=dev --no-audit --no-fund --no-package-lock
          npm run smoke:paige-browser-render
          node services/paige-browser/smoke-pdf.mjs

      - name: Tier-feature guard (§60 — render gates must not hardcode a tier; use useTierFeatures)
        if: ${{ !cancelled() }}
        run: npm run lint:tier-features

      - name: Legacy-mark guard (2026-09-06 — retired orbital PaigeMark must not return; use PaigeCommandMark)
        if: ${{ !cancelled() }}
        run: npm run lint:legacy-mark

      - name: Legacy-mark guard self-test
        if: ${{ !cancelled() }}
        run: npm run lint:legacy-mark:test

      - name: Managed-schema ownership guard (#643 — migrations replay as `postgres`; ALTER/DROP TABLE on a Supabase-owned schema fails 42501 on every fresh Preview)
        if: ${{ !cancelled() }}
        run: npm run lint:managed-schema

      - name: Skeleton-content guard (§18/§24 Task #126 — index.html #root must carry only whitelisted SEO copy, no product content)
        if: ${{ !cancelled() }}
        run: npm run lint:skeleton

      # The operator console's shadcn compatibility bridge only ever descends. Adding an alias
      # re-creates the mapping that made the console render the wrong palette; the count going
      # down is the port finishing. Empty means: delete this gate.
      - name: Alias ratchet (operator console bridge — the count only descends)
        if: ${{ !cancelled() }}
        run: npm run lint:alias-ratchet

      # The console's --pg-* values must MATCH Claude Design's pack, not resemble it. The console
      # shipped once with the pack MAPPED ONTO our shadcn tokens — every name right, every value
      # ours — and nothing in CI could see it. This compares values, both themes.
      - name: Design-system parity (--pg-* values vs the CD pack)
        if: ${{ !cancelled() }}
        run: npm run lint:pg-tokens

      # A ported surface is only ported if it was ported from v3. A handoff once counted 370KB of
      # unmounted surface as one class and recommended mounting all of it; 232KB cited the pack
      # ruled dead, so mounting it would have installed the retired design through the fix meant
      # to remove it. This keeps those files stripped and catches the next one.
      - name: Pack lineage (no unreachable dead-pack surfaces)
        if: ${{ !cancelled() }}
        run: npm run lint:pack-lineage

      # BUILD-ORDER Layer 1's done-condition, as a gate rather than a habit: every module under
      # src/operator/ must be reachable from OperatorEntry. The main audit found ~370KB of correct
      # porting that no live path imported and only its own tests pinned — so the suite was green
      # and none of it was on a screen. A test rendering a component is not the console rendering
      # it. An orphan is mounted, deleted, or exempted with a written reason.
      - name: Operator reachability (no orphaned surfaces)
        if: ${{ !cancelled() }}
        run: npm run lint:operator-reach

      # A Tailwind arbitrary shadow built from a bare `var()` compiles to `--tw-shadow-color` and
      # emits NO box-shadow. Nothing errors; the class sits in the markup and the element renders
      # flat. It was diagnosed once, fixed at one site, written up, and never swept — until the
      # owner reported live that the buttons had lost their texture and a Chromium measurement
      # returned `boxShadow: "none"` on controls whose class list plainly declares a lift. 59
      # occurrences across 34 files. Invisible to tsc, to eslint, to jsdom, and to reading the
      # source, so it is caught mechanically or not at all.
      - name: Arbitrary var() shadows carry the `shadow:` hint
        if: ${{ !cancelled() }}
        run: npm run lint:shadow-vars

      # Every tool the runtime GOVERNS must be one the operator can SEE. `MUTATING_TOOLS` in
      # paige-ai-chat gates 46 tools; `list_tool_autonomy()` — the catalogue the Capabilities
      # surface renders — carries 23. The other 23 are governed invisibly: they cannot be flipped
      # to autopilot and cannot be turned OFF, including a permanent workflow delete. It is drift
      # from a migration that re-declared the catalogue from a stale copy, and it is a RATCHET
      # here rather than a wall: the known 23 are the baseline, and the guard fails when the gap
      # grows or when a fixed one is left in the baseline.
      - name: Governed tools are visible in the autonomy catalogue
        if: ${{ !cancelled() }}
        run: npm run lint:tool-catalogue

      # The guard above also walks EVERY consecutive pair of catalogue declarations, because
      # `list_tool_autonomy` is CREATE OR REPLACEd with its whole body: a migration written from a
      # stale copy erases every row added after that copy was taken. That is not hypothetical — on
      # 2026-09-13 a lane whose migration sorted EARLIER than the tip had 25 governed CRM rows
      # erased the moment it merged, and shipped a second migration to put them back. The check is
      # pre-merge: a PR branch already carries the other lane's migration. This proves it bites,
      # including the case where grading only the newly-added file would pass.
      - name: ...and the catalogue guard fails when a declaration erases rows
        if: ${{ !cancelled() }}
        run: npm run lint:tool-catalogue:test

      # The patch field list the model sees is GENERATED from the database allowlist. On 2026-09-25
      # an approved contact create threw `CRM_PATCH_FIELDS_INVALID:company_name,zip` on production:
      # Paige sent `company_name` and `zip`, the executor accepts `entity_name` and `zip_code`, and
      # the tool schema described `patch` as a bare `{ type: "object" }` — so she had no way to know
      # the real names and used the ones a person would say. The seven allowlists live in two
      # plpgsql functions and are NOT identical to each other (`contact.create` takes `notes`,
      # `contact.update` takes `current_notes`), so a single hardcoded map gets four of the seven
      # wrong. This re-derives all seven from the migrations that define those functions and fails
      # on any difference, so a field added or renamed in the database cannot leave the schema
      # quietly stale. No secrets and no network: it runs on fork PRs too. It is deliberately only
      # HALF the guard — it reads migration TEXT, which means re-implementing the "newest
      # definition wins" rule Postgres already owns. The other half,
      # `supabase/tests/crm_patch_fields_match_database.sql`, asks a real database via
      # pg_get_functiondef() in the `paige-spine-contract` database-contract job. Both artifacts
      # are generated in one pass, so they cannot disagree without one of the two going red.
      - name: CRM patch schema still matches the database allowlist
        if: ${{ !cancelled() }}
        run: npm run lint:crm-patch-fields

      # ...and proof the guard BITES. Reinstates the original defect (`entity_name` renamed back to
      # `company_name`) and asserts the check goes red and names the exact delta, plus the cases a
      # green-only check would miss: an eighth allowlist appearing with no action mapped to it, an
      # earlier-sorting migration shadowing a later one, and an allowlist escaping its own branch.
      - name: ...and the CRM patch guard fails when the database drifts
        if: ${{ !cancelled() }}
        run: npm run lint:crm-patch-fields:test

      # Every reason `tenant_comms_readiness()` can BLOCK a tenant for must have a
      # next step on the surface that renders it. The two halves live in a SQL
      # migration and a React file, reviewed at different times by different eyes,
      # and nothing connected them: they are in exact parity today, by hand. Where
      # the map has no entry the surface says "Some setup is still outstanding." —
      # honest, and no next step, which is the dead end the usability pass exists
      # to remove. Adding a seventh reason to the migration is the whole cost.
      - name: Blocking reasons carry a next step (Connections has no dead ends)
        if: ${{ !cancelled() }}
        run: npm run lint:readiness-copy
      # Every mutation Paige can perform carries a risk classification, and an action with no
      # classification cannot run. This fails the change that would add a write tool without
      # classifying it — in the repository, rather than in production where the runtime's own
      # fail-closed guard would turn it into an inert tool nobody understands.
      # A colliding migration version does not fail on push — it is SKIPPED, and every downstream
      # signal (CI, the db-live tag, the preview badge) stays green while the migration never
      # reaches production. The Supabase preview reports only the FIRST duplicate key, so it cannot
      # be relied on to enumerate them.
      # Compared against the base branch TIP, not the merge base. The merge base is main as it
      # was when this branch forked, so a version main adds AFTER the fork is invisible to the
      # check -- which is exactly how 20261201000700 was reused here and stayed green until
      # `supabase start` failed on a duplicate schema_migrations key. Only `baseFiles` is
      # affected: the added-file set is computed with `${base}...HEAD`, which git already
      # resolves through the merge base, so it is identical either way.
      - name: No migration reuses a version (a reused version is silently skipped, never applied)
        if: ${{ !cancelled() }}
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || steps.mergebase.outputs.mb }}
        run: npm run lint:migration-versions

      - name: Migration-version guard catches what it claims to
        if: ${{ !cancelled() }}
        run: npm run lint:migration-versions:test

      # An audit row that names a table which does not exist is unresolvable, and reads as correct.
      # The harness already asserted a rail event NAMES a record; a wrong name satisfies that. This
      # checks the name is true, which needs a schema and so belongs here rather than in the harness.
      - name: Every attribution target is a real table (a rail row must resolve)
        if: ${{ !cancelled() }}
        run: npm run lint:write-targets

      - name: Attribution-target guard catches what it claims to
        if: ${{ !cancelled() }}
        run: npm run lint:write-targets:test

      - name: Every write tool is classified by the action-risk policy
        if: ${{ !cancelled() }}
        run: npm run lint:action-risk

      # Risk classification fails CLOSED and is gated above. Evidence coverage did not: which
      # capabilities write a receipt was three hand-maintained Sets with no guard, so a lane could
      # classify a new write tool correctly, ship it, emit no receipt, and nothing would say so.
      # This asks for a DECLARATION rather than detecting emission, because a static detector
      # cannot reliably tell which tool a recordCapabilityRun call belongs to.
      - name: Every classified mutation declares whether it writes a receipt
        if: ${{ !cancelled() }}
        run: npm run lint:receipt-coverage

      - name: Receipt-coverage guard catches what it claims to
        if: ${{ !cancelled() }}
        run: npm run lint:receipt-coverage:test

      # The sibling DEFINER guard matches an EXPLICIT grant to anon/PUBLIC, per file, by name. It
      # is blind to a function with NO acl at all (which inherits EXECUTE TO PUBLIC) and to a new
      # OVERLOAD of a name whose sibling it already saw granted. That is how record_capability_run
      # lost its lock. `lint:definer-fns` now runs both rules; this proves the new one bites.
      - name: DEFINER signature-ACL guard catches what it claims to
        if: ${{ !cancelled() }}
        run: npm run lint:definer-fns:test

      # Three separate slices independently built a SECOND way to prove the operator approved
      # something (#709, #711, #718). Each was competent alone; a door with three locks is only
      # as strong as the weakest, and nobody inspects the weak one. This fails a new channel —
      # not a new gated action, which needs no approval path of its own.
      - name: One approval channel (a second way to say yes is a way in)
        if: ${{ !cancelled() }}
        run: npm run lint:approval-gate

      # Owner ruling 2026-09-01: domains own features, the Spine owns governance, Chat is a
      # consumer. A RATCHET, not a wall — the handler already declares 100 tools inline and the
      # ruling says migrate one at a time with no big-bang refactor. The baseline may shrink; it
      # must not grow, so new coupling cannot be added silently.
      - name: No new tool is hand-wired into the Chat handler
        if: ${{ !cancelled() }}
        run: npm run lint:chat-tool-registry

      # THE MODEL↔SPINE SEAM, which nothing held before. `lint:tool-catalogue` holds
      # runtime↔operator; this holds "every tool the model can call is DECLARED by a domain".
      # Measured on this tree: 154 tools on the maximum model surface, 65 declared, 89 not —
      # and 46 of those 89 MUTATE, so they can act unattended the moment a tenant sets them to
      # `auto`. A RATCHET on that gap (exact keys with their kind, never a bare count: a read
      # tool that later gains a risk class fails even though membership stayed flat), and a
      # WALL on agreement — where a tool has both a Spine capability and an action-risk class
      # they must not contradict each other, which has zero violations today.
      - name: Every model-callable tool is declared by a domain (capability ratchet)
        if: ${{ !cancelled() }}
        run: npm run lint:capability-declaration

      # The guard's own proof, including a negative fixture that drives the REAL check against a
      # baseline with one entry removed and asserts it exits non-zero. A guard nobody proved can
      # fail is theatre.
      - name: Capability declaration guard can actually fail
        if: ${{ !cancelled() }}
        run: npm run lint:capability-declaration:test

      - name: Chat-tool registry ratchet catches what it claims to
        if: ${{ !cancelled() }}
        run: npm run lint:chat-tool-registry:test

      - name: Approval-channel guard catches what it claims to
        if: ${{ !cancelled() }}
        run: npm run lint:approval-gate:test

      # The FRONTEND never marks a paige_pending_approvals row 'approved' itself — that status
      # comes only through the canonical execute-approval seam (§10/§18), which executes the
      # consequence + writes Rail/receipt. A direct browser status='approved' write bypasses the
      # seam and silent-drops a message send. The mounted approve surfaces already route through
      # the seam; this locks that in so it cannot regress. (Declines stay direct — out of scope.)
      - name: No direct approved-write to paige_pending_approvals from the frontend
        if: ${{ !cancelled() }}
        run: npm run lint:approval-direct-write

      - name: Direct-approved-write guard catches what it claims to
        if: ${{ !cancelled() }}
        run: npm run lint:approval-direct-write:test

      # The Surface Binding Ledger is the Paige OS Integration release/regression contract. A surface
      # may not be reported LIVE / "Paige-connected" without a complete ledger entry proven by
      # authenticated runtime — a rendered page, a badge, a prototype, or an "Open Paige" button never
      # satisfies a binding link (§13/§32). Docs alone drift; this makes the honest-state rule fail CI.
      - name: Surface Binding Ledger is complete and honestly stated
        if: ${{ !cancelled() }}
        run: npm run lint:binding-ledger

      - name: Binding-ledger guard catches what it claims to
        if: ${{ !cancelled() }}
        run: npm run lint:binding-ledger:test

      # The Integration Capability Registry is the provider-governance delivery contract. A provider
      # may not be catalogued dishonestly (an unbuilt integration claiming a real acting lane, a LIVE
      # entry with no provable receipt, a Marketplace entry leaking per-tenant data) or incompletely.
      # Docs alone drift; this makes the honesty invariants + the "listed ≠ connected" rule fail CI.
      - name: Integration Capability Registry is complete and honestly stated
        if: ${{ !cancelled() }}
        run: npm run lint:integration-registry

      - name: Integration-registry guard catches what it claims to
        if: ${{ !cancelled() }}
        run: npm run lint:integration-registry:test

      # RELEASE_GOVERNANCE_POLICY: every agent/PR/closeout entry point must route to the one policy,
      # and any checked-in customer release record must preserve exact build identity and honest state.
      - name: Release governance policy and records are complete
        if: ${{ !cancelled() }}
        env:
          # Historical release records compare with the CURRENT PR base, not the branch fork point:
          # a stale branch must not erase a record that landed on main after it diverged.
          RELEASE_GOVERNANCE_BASE: ${{ github.event.pull_request.base.sha || github.event.before || steps.mergebase.outputs.mb }}
        run: npm run lint:release-governance

      - name: Release-governance guard catches what it claims to
        if: ${{ !cancelled() }}
        run: npm run lint:release-governance:test

      - name: Customer update manifest fails closed
        if: ${{ !cancelled() }}
        run: npm run test:customer-update-manifest

      - name: Action-risk guard catches what it claims to
        if: ${{ !cancelled() }}
        run: npm run lint:action-risk:test

      # The shared governed execution seam must stay blind to which door called it. A decision
      # that consults the door makes "reach it a different way" a way to gain permission — which
      # is how 119 MCP tools ended up outside the gate entirely (#784).
      - name: Lint — governed execution seam is door-blind and has one approval home
        if: ${{ !cancelled() }}
        run: npm run lint:governed-execution

      - name: Governed-execution guard catches what it claims to
        if: ${{ !cancelled() }}
        run: npm run lint:governed-execution:test
      # An MCP tool's arguments are authored by a MODEL, so a `confirm: true` read out of them
      # gates destruction on a value the thing being gated wrote. `bulk_delete_contacts` shipped
      # exactly that shape and hard-deleted up to 100 client rows with the service-role client
      # (#784). The Chat-side guard cannot see it: paige-mcp is not in its file list.
      - name: Lint — no destructive MCP action gated on a model-supplied boolean
        if: ${{ !cancelled() }}
        run: npm run lint:mcp-destructive-confirm

      - name: MCP destructive-confirm guard catches what it claims to
        if: ${{ !cancelled() }}
        run: npm run lint:mcp-destructive-confirm:test

      # Every tool on the MCP surface goes through ONE governed door. The registration shape —
      # 119 separate top-level `mcp.tool(...)` calls — means a 120th dispatches with no gate and
      # no test fails, because a test only exercises the tools it knows about. This guard is the
      # structural half: the map is complete both ways, the chokepoint still calls the adapter,
      # there is no second door, and no mutation is wearing a read's declaration.
      - name: Lint — one governed MCP door, and the capability map is complete
        if: ${{ !cancelled() }}
        run: npm run lint:mcp-governed-door

      - name: MCP governed-door guard catches what it claims to
        if: ${{ !cancelled() }}
        run: npm run lint:mcp-governed-door:test

      # A similarity search whose search_path excludes `extensions` cannot resolve `<=>` and raises
      # on every call. Three shipped functions were in that state for months, invisible because
      # every call site degrades to an empty result — "no matches" and "cannot execute" look the
      # same from outside.
      - name: Vector searches can resolve their own operator
        if: ${{ !cancelled() }}
        run: npm run lint:vector-path

      - name: Vector search-path guard catches what it claims to
        if: ${{ !cancelled() }}
        run: npm run lint:vector-path:test

      - name: ESLint (changed src)
        if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && steps.changed.outputs.src_count != '0' }}
        run: xargs -r -a changed_src.txt ./node_modules/.bin/eslint

      - name: Gold-discipline (changed src)
        if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && steps.changed.outputs.src_count != '0' }}
        run: xargs -r -a changed_src.txt node scripts/gold-discipline-lint.mjs

      # Impeccable (npm `impeccable`, Apache-2.0) — UI anti-pattern detection on the files this
      # PR actually touches, the same posture as the two lints above. Deliberately NOT repo-wide:
      # `src/index.css` carries pre-existing findings (an overused face, gradient-clipped text,
      # bounce easing) and failing every unrelated PR on them would train people to ignore the
      # gate. Touch a file, own its findings.
      #
      # The CLI exits 0 clean / 2 findings / 1 could-not-scan and prints findings to STDERR.
      # MEASURED: xargs collapses any non-zero child status to 123, so this step fails on both
      # findings and an unscannable target without distinguishing them — the same trade the two
      # xargs lints above already make. Do not pipe it; a pipe would report the pipe's status
      # and mask the failure entirely. The engine binary is platform-specific and gitignored,
      # so CI fetches it through npx at the pinned version.
      - name: Impeccable — UI anti-patterns (changed src)
        if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && steps.changed.outputs.ui_count != '0' }}
        run: |
          node --test scripts/ci/check-source-utf8.test.mjs
          xargs -r -a changed_ui.txt node scripts/ci/check-source-utf8.mjs
          xargs -r -a changed_ui.txt npx --yes impeccable@4.1.0 detect

      # --- Edge functions: the gap this closes (task #142) ---------------------------------
      # NOTHING compiled an edge function before it deployed. `tsc` covers src/ only (edge fns
      # are Deno and are not in the Vite tsconfig) and `prove` looks at migrations only, so the
      # first thing that compiled a function was the deploy itself, by which point it was live.
      #
      # CORRECTION 2026-09-01: this block used to add that Supabase Preview's Edge Functions task
      # "never runs" because the migration replay "fails on every PR (#211)". That stopped being
      # true on 2026-08-30, when #643 guarded the duplicate bootstrap `CREATE TABLE public.profiles`
      # that was killing the replay. Preview now completes Configurations → Migrations → Seeding →
      # Edge Functions clean (observed four consecutive runs on #721).
      #
      # THE GATE BELOW STAYS, and its real justification is stronger than the one it replaces:
      # Preview type-checks ONE tree. This ratchet compares the PR BASE against the HEAD and fails
      # only on NEW or increased diagnostics, which is what lets a function carrying inherited debt
      # be edited at all. Preview has never done that and still does not.
      #
      # SCOPE, stated honestly: this checks the functions THIS PR affects, not the ~249 already
      # in the tree. It stops new breakage; it is not a retroactive audit of what is already
      # deployed (that would be its own slice, and on this codebase almost certainly a ratchet
      # in the shape of scripts/ci/tsc-ratchet.mjs).
      #
      # The affected set is computed by the SAME script the deploy uses
      # (.github/scripts/edge-affected.py), which follows relative imports transitively — so a
      # change to one _shared file checks every function that pulls it in. Reusing it means the
      # set CI CHECKS and the set CI DEPLOYS can never drift apart (§18: one home).
      - name: Resolve affected edge functions
        id: affected_fns
        if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && steps.changed.outputs.fn_count != '0' }}
        run: |
          # pipefail: GitHub's default shell is `bash -e {0}` with NO pipefail, so a pipeline
          # reports the LAST command's status. `... | tee affected_fns.txt` therefore returned
          # tee's 0 even when the resolver crashed, leaving affected_fns.txt EMPTY, count=0, the
          # ratchet step skipped, no evidence uploaded, and the job green having type-checked
          # nothing. Redirect instead of piping so there is no pipeline to mask.
          set -o pipefail
          python3 .github/scripts/edge-affected.py < changed_fns.txt > affected_fns.txt
          cat affected_fns.txt
          # A change under supabase/functions/<fn>/ is affected by construction, so if any changed
          # file lives in a real function DIRECTORY and nothing resolved, the resolver failed.
          #
          # A change confined to _shared/ is a different case, and this guard used to get it wrong.
          # `edge-affected.py`'s own contract says "Exit 0 always (an empty result is a valid
          # 'nothing to deploy')" — and a NEW _shared module that no function imports YET resolves
          # to zero legitimately. The old condition counted every changed edge file, so adding such
          # a module failed the build for a correct change, with an error message blaming a resolver
          # that had worked perfectly. First hit by the governed-execution seam, a shared module
          # deliberately adopted by nothing in its first slice.
          #
          # The resolver-crash detector is unchanged in the case it was written for: a changed file
          # inside a function directory that resolves to zero functions still fails, loudly.
          changed_in_fn_dirs="$(grep -cE '^supabase/functions/[^_/][^/]*/' changed_fns.txt || true)"
          if [ "$changed_in_fn_dirs" -gt 0 ] && [ "$(grep -c . affected_fns.txt || true)" -eq 0 ]; then
            echo "::error::edge-affected resolved 0 functions from $changed_in_fn_dirs changed file(s) inside a function directory - treating as a resolver failure, not an empty result."
            exit 1
          fi
          echo "count=$(grep -c . affected_fns.txt || true)" >> "$GITHUB_OUTPUT"

      # UNCONDITIONAL. The ratchet's own contract tests drive a REAL `deno check` against a
      # disposable candidate, and they run in the whole-repo gate block below whether or not this
      # PR touched an edge function. A comparator-only suite proved insufficient once already:
      # the shipped runner classified an unexplained nonzero exit as clean while every synthetic
      # comparator test passed. So deno is always present, and RATCHET_REQUIRE_DENO makes its
      # absence a hard failure rather than a quietly skipped case.
      - name: Setup Deno
        if: ${{ !cancelled() }}
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Secure Browser interpreter evidence smoke (tenant attribution and failed-write honesty)
        if: ${{ !cancelled() }}
        run: deno run -A scripts/skill-interpreter-browse-smoke.ts

      - name: Secure Browser authority matrix (authenticate-first and truthful provenance)
        if: ${{ !cancelled() }}
        run: deno run -A scripts/secure-browser-authority-smoke.ts

      # RATCHET, not a wall — and never a relaxation. The all-or-nothing form of this check
      # turned red on the first PR to touch a function carrying inherited debt, for errors the
      # PR did not write; the pressure that creates is to weaken the gate, which is the one
      # outcome that must not happen. So the SAME pinned check runs on the PR base and on the
      # head, and only NEW or INCREASED diagnostics fail.
      #
      # Two rules stop it becoming a rubber stamp:
      #   - A module-resolution failure is never ratchetable. It is not a type-check result; it
      #     means the file was not checked at all. On the head that is fatal. On the base it
      #     means the baseline is unknowable, so NOTHING is credited and the head must be clean.
      #   - An inherited diagnostic is inherited only while its origin file is byte-identical
      #     across the two legs. A CHANGED shared dependency is candidate code, not baseline.
      #
      # No continue-on-error, no `exit 0`, no advisory green, no per-PR exception. Both legs are
      # uploaded as evidence so a reviewer can read what each actually produced.
      - name: Deno ratchet (affected edge functions — fails on NEW or increased diagnostics)
        # `count != ''` as well as `!= '0'`: an empty count means the resolve step did not run or
        # produced no output, and an unbounded run is a configuration error, not a no-op pass.
        if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && steps.affected_fns.outputs.count != '' && steps.affected_fns.outputs.count != '0' }}
        env:
          BASE: ${{ steps.mergebase.outputs.mb }}
          HEAD: ${{ steps.mergebase.outputs.head }}
          # The set CI resolved and the set the ratchet grades must be identical. Without this,
          # an empty or truncated affected_fns.txt makes the ratchet report "nothing to compare"
          # and exit 0 while functions were in fact affected.
          EXPECT: ${{ steps.affected_fns.outputs.count }}
        run: |
          set -uo pipefail
          node scripts/ci/deno-edge-ratchet.mjs \
            --base "$BASE" \
            --head "$HEAD" \
            --functions "$(tr '\n' ' ' < affected_fns.txt)" \
            --expect "$EXPECT" \
            --out deno-ratchet-evidence

      - name: Upload Deno ratchet evidence (base and head legs)
        if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && steps.affected_fns.outputs.count != '' && steps.affected_fns.outputs.count != '0' }}
        uses: actions/upload-artifact@v4
        with:
          name: deno-ratchet-evidence
          path: deno-ratchet-evidence/
          # ERROR, not warn. The whole point of the two legs is that a reviewer can read what each
          # actually produced; evidence that silently failed to appear leaves a green gate backed
          # by nothing. The runner also re-reads every artifact from disk before it reports a
          # verdict, so this is the second of two independent checks on the same property.
          if-no-files-found: error

      # The ratchet needs a PR base, so it cannot run on a push to main. Say so in the log: an
      # absent gate should never have to be inferred from a missing step.
      - name: Note — edge ratchet needs a PR base
        if: ${{ !cancelled() && github.event_name != 'pull_request' && github.event_name != 'workflow_dispatch' }}
        run: echo "::notice::deno edge ratchet skipped - no PR base for a ${{ github.event_name }} event; affected edge functions were NOT type-checked in this run."

      # --- Whole-repo hard gates (PR + push). `!cancelled` so one run surfaces every failure. ----
      # A comparator that decides a gate is itself a gate. RATCHET_REQUIRE_DENO=1 turns the
      # real-deno leg from an "unverified here" note into a hard failure, so CI can never report
      # this suite green on the synthetic legs alone.
      - name: Deno ratchet contract tests (comparator + real runner + real deno)
        if: ${{ !cancelled() }}
        env:
          RATCHET_REQUIRE_DENO: '1'
        run: npm run test:deno-ratchet

      # Proof-lane PURE logic (the authenticated-proof framework's honest core). Browser-free, so it
      # runs here; the browser MECHANICS are proved by scripts/live-drive/proof-lane.selftest.mjs in
      # the pre-provisioned sandbox (CI has no browser — see scripts/live-drive/PROOF-LANE.md).
      - name: Proof-lane framework unit tests
        if: ${{ !cancelled() }}
        run: npm run test:proof-lane

      - name: Typecheck (ratchet — fails on NEW type errors only)
        if: ${{ !cancelled() }}
        run: npm run ci:tsc

      - name: Build
        if: ${{ !cancelled() }}
        run: npm run build

      - name: Billing payment setup safety and reconciliation
        if: ${{ !cancelled() }}
        run: |
          node --import ./scripts/client-memory-authz/register.mjs --test scripts/billing-payment-setup.test.mjs supabase/functions/_shared/payment-setup-reconciliation.test.ts
          deno test --allow-import=esm.sh,deno.land --deny-net --deny-env --deny-read --deny-write --deny-run --deny-ffi --deny-sys supabase/functions/_shared/stripe-webhook-signature.test.ts
          # --no-check here and NOT on the line above, deliberately. This module's import graph
          # reaches `systems-check-runner.ts` -> `prompt-forge.ts`, which carries three PRE-EXISTING
          # type errors (TS2769 x2, TS2345). Typechecking that graph is `deno-edge-ratchet`'s job and
          # it holds a baseline for exactly those; this line's job is to run the behaviour. Without
          # the flag the step fails on errors this PR did not introduce and cannot fix here — which
          # is why the sibling `_business-context-readiness.test.ts` was written and never wired in.
          deno test --no-check --allow-import=esm.sh,deno.land --deny-net --deny-env --deny-read --deny-write --deny-run --deny-ffi --deny-sys supabase/functions/_shared/systems-check-runners/revenue_tracking_configured.test.ts

      - name: Agreements engine — token contract, PDF seal, and database integrity (INT-163)
        if: ${{ !cancelled() }}
        run: |
          # These run under Deno, not vitest: vitest globs src/** only, so an edge-function test
          # placed beside its module executes NOWHERE unless it is named here.
          #
          # --node-modules-dir=none is LOAD-BEARING, not tidiness. Because the repo has a
          # package.json, Deno otherwise materialises its own npm layout under node_modules/.deno —
          # measured at 682 packages — which shadows the npm-installed `vite` and breaks `npm run
          # test` in the LATER step. `none` makes Deno resolve `npm:pdf-lib` from its own cache and
          # leave node_modules completely untouched. Do not "fix" a resolution error by switching
          # this back to auto; add the dependency or vendor it instead.
          deno test --allow-import --node-modules-dir=none --deny-net --deny-env --deny-run --deny-ffi --deny-sys \
            supabase/functions/_shared/agreements/token.test.ts \
            supabase/functions/_shared/agreements/document.test.ts \
            supabase/functions/_shared/agreements/signing-guard.test.ts
          # The edge functions must at least TYPE-check; none is exercised by the tests above.
          deno check --allow-import --node-modules-dir=none \
            supabase/functions/sign-agreement/index.ts \
            supabase/functions/agreement-document/index.ts \
            supabase/functions/agreement-send/index.ts
          # The integrity proof stands up its own throwaway Postgres cluster and asserts the exact
          # SQLSTATE of every refusal, plus positive controls. It needs no credentials.
          ./scripts/agreements/run-integrity-proof.sh

      - name: Commercial terms — every refusal announces itself with a code (Sales)
        if: ${{ !cancelled() }}
        run: |
          # `tenant_client_agreements` had zero rows in production and nobody could say why: 30 of
          # the 38 refusals in its two writers were bare RAISE EXCEPTION, defaulting to P0001, which
          # the surface maps to nothing. This drives the real functions on a throwaway cluster and
          # asserts the SQLSTATE each refusal class must carry, plus the raise-site clamp on the
          # values they echo back. It needs no credentials.
          ./scripts/sales/commercial-terms-refusal-proof.sh

      - name: INT-328 comms email — real two-session concurrency proof (throwaway cluster)
        if: ${{ !cancelled() }}
        run: |
          # The governed business email's claim/finalize must hold under REAL concurrent sessions: one
          # dispatch per operation, one admission per identical content, no "Not sent" over a claimed
          # send. This stands up its own throwaway Postgres cluster (the same pattern as the two proofs
          # above), applies the migration verbatim over a local dependency stub, and races separate
          # psql backends. It needs no credentials and touches no real database. The 81+ assertion
          # rollback proof (scripts/sql/comms-email-send-proof.sql) needs the production schema, so it
          # is run against production in BEGIN..ROLLBACK, not here.
          PGBIN=""
          for c in /usr/lib/postgresql/*/bin /usr/pgsql-*/bin; do [ -x "$c/initdb" ] && PGBIN="$c"; done
          [ -x "$PGBIN/initdb" ] || { echo "FAIL — no PostgreSQL server binaries. Deliberately NOT skipped: a skipped proof reads exactly like a passing one."; exit 2; }
          WORK="$(mktemp -d)"; PORT=55461
          trap '"$PGBIN/pg_ctl" -D "$WORK/d" stop -m immediate >/dev/null 2>&1 || true; rm -rf "$WORK"' EXIT
          "$PGBIN/initdb" -D "$WORK/d" -U p --auth=trust >/dev/null
          "$PGBIN/pg_ctl" -D "$WORK/d" -o "-p $PORT -k $WORK -c listen_addresses=127.0.0.1" -l "$WORK/log" start >/dev/null
          for _ in $(seq 1 20); do "$PGBIN/pg_isready" -h 127.0.0.1 -p "$PORT" >/dev/null 2>&1 && break; sleep 0.5; done
          node scripts/sql/comms-email-send-concurrency-proof.mjs "$PGBIN/psql" "$PORT" p "$WORK/d"

      - name: INT-336 — typed supersession and canonical settlement
        if: ${{ !cancelled() }}
        run: |
          deno test --allow-import=deno.land --node-modules-dir=none --deny-net --deny-env --deny-read --deny-write --deny-run --deny-ffi --deny-sys \
            supabase/functions/_shared/paige-turn/interactive.test.ts \
            supabase/functions/_shared/paige-turn/interactive-approval.test.ts
          node --import ./scripts/knowledge-scope/register.mjs scripts/int336-handler-check.mjs
          node --import ./scripts/knowledge-scope/register.mjs scripts/int336-two-tool-check.mjs
          node --import ./scripts/knowledge-scope/register.mjs scripts/int336-native-preview-check.mjs
          node --import ./scripts/knowledge-scope/register.mjs scripts/int336-native-pipeline-check.mjs
          INT336_UNKNOWN_TOOL=plan_create node --import ./scripts/knowledge-scope/register.mjs scripts/int336-two-tool-check.mjs
          INT336_UNKNOWN_TOOL=plan_list node --import ./scripts/knowledge-scope/register.mjs scripts/int336-two-tool-check.mjs
          node --import ./scripts/knowledge-scope/register.mjs scripts/int336-long-settlement-check.mjs

      - name: INT-336 — real PostgreSQL canonical thread fence
        if: ${{ !cancelled() }}
        run: |
          PGBIN=""
          for c in /usr/lib/postgresql/*/bin /usr/pgsql-*/bin; do [ -x "$c/initdb" ] && PGBIN="$c"; done
          [ -x "$PGBIN/initdb" ] || { echo "FAIL — PostgreSQL server binaries missing"; exit 2; }
          WORK="$(mktemp -d)"; PORT=55462
          trap '"$PGBIN/pg_ctl" -D "$WORK/d" stop -m immediate >/dev/null 2>&1 || true; rm -rf "$WORK"' EXIT
          "$PGBIN/initdb" -D "$WORK/d" -U postgres --auth=trust >/dev/null
          "$PGBIN/pg_ctl" -D "$WORK/d" -o "-p $PORT -k $WORK -c listen_addresses=127.0.0.1" -l "$WORK/log" start >/dev/null
          "$PGBIN/createdb" -h 127.0.0.1 -p "$PORT" -U postgres int336_test
          PSQL_BIN="$PGBIN/psql" INT336_DATABASE_URL="postgresql://postgres@127.0.0.1:$PORT/int336_test" node scripts/int336-database-check.mjs

      - name: C4a/C4b — an approval resumes the same objective (the pure resume model)
        if: ${{ !cancelled() }}
        run: |
          # The pure half of the server-carried approval resume (docs/delivery/paige-conversational-loop-c4.md):
          # the act is rebuilt from its stored row only, its call id is deterministic and provider-safe,
          # only general-gate writes are carried forward by the general gate, a door proposal is handed
          # back to its door only in a shape the door accepts and only for this workspace (C4b), the
          # outcome reads the act's own result, and the saved record is closed enums read defensively.
          # The handler is driven end to end by test:client-memory-authz (groups 39 and 40).
          deno test --allow-import=deno.land --node-modules-dir=none --deny-net --deny-env --deny-read --deny-write --deny-run --deny-ffi --deny-sys \
            supabase/functions/_shared/paige-turn/resume.test.ts

      - name: INT-332 — an accepted offer is the task, and a card is never narrated into being (the pure half)
        if: ${{ !cancelled() }}
        run: |
          # Action continuity (supabase/functions/_shared/paige-turn/continuity.ts): an affirmative continues
          # ONE fresh offer PAIGE just made — never a standing card/question/work, a stale offer, a choice
          # between actions, or a reply that hedges or changes it — and a reply may not claim an approval card
          # no tool created, or decide approval itself. Fixtures are the 2026-10-06 prod strand's own turns.
          # The handler and the real crm-command door are driven end to end by test:client-memory-authz (group 43).
          deno test --allow-import=deno.land --node-modules-dir=none --deny-net --deny-env --deny-read --deny-write --deny-run --deny-ffi --deny-sys \
            supabase/functions/_shared/paige-turn/continuity.test.ts

      - name: INT-334 R3 — the Turn Route (state before words, class before model) and the finished-round tool gate
        if: ${{ !cancelled() }}
        run: |
          # The Turn Route (supabase/functions/_shared/paige-turn/route.ts): thread state sets a floor no
          # classifier lowers; cheap never carries tools; a route carries no authority; Sol/Astra lead,
          # Sonnet 5.5 is second; fallback only on recognised provider-health failures, never after output.
          # The round gate (round.ts): a tool call runs only from a round that reached a normal tool-use stop.
          deno test --allow-import=deno.land --node-modules-dir=none --deny-net --deny-env --deny-read --deny-write --deny-run --deny-ffi --deny-sys \
            supabase/functions/_shared/paige-turn/route.test.ts supabase/functions/_shared/paige-turn/round.test.ts \
            supabase/functions/_shared/paige-turn/classify.test.ts
          # The same gate through BOTH real stream converters (Anthropic and OpenAI), provider-native events.
          npm run -s test:round-gate

      - name: A user's address is read from user_contact_methods (RAG ingest, canary, funding report)
        if: ${{ !cancelled() }}
        run: |
          # profiles has no email column; these three functions selected it and failed with 42703.
          # The shared read and the anonymizer that consumes it, executed:
          deno test --allow-import=esm.sh,deno.land --node-modules-dir=none --deny-net --deny-env --deny-read --deny-write --deny-run --deny-ffi --deny-sys \
            supabase/functions/_shared/user-contact-methods.test.ts
          # The functions that call it must type-check. ingest-rag-outcome is left out: it carries
          # nine supabase-js generic errors that predate this step, identical on the base commit;
          # the deno-edge-ratchet holds functions like it to "no new errors".
          deno check --allow-import --node-modules-dir=none \
            supabase/functions/security-canary-probe/index.ts \
            supabase/functions/send-funding-report/index.ts \
            supabase/functions/schedule-automated-tasks/index.ts \
            supabase/functions/voice-command-processor/index.ts

      - name: The platform email sender is not an open relay (who may send, and to whom)
        if: ${{ !cancelled() }}
        run: |
          # send-transactional-email trusted the gateway's verify_jwt, which the public publishable key
          # passes. The in-body decision, executed: no token and the publishable key are refused;
          # internal callers pass; a person sends only listed templates to a server-bound recipient.
          deno test --allow-import=esm.sh,deno.land --node-modules-dir=none --deny-net --deny-env --deny-read --deny-write --deny-run --deny-ffi --deny-sys \
            supabase/functions/_shared/email/send-authority.test.ts
          deno check --allow-import --node-modules-dir=none \
            supabase/functions/send-transactional-email/index.ts \
            supabase/functions/affiliate-application-confirm/index.ts \
            supabase/functions/notify-approval-event/index.ts \
            supabase/functions/agreement-send/index.ts \
            supabase/functions/send-beta-launch-email/index.ts \
            supabase/functions/send-admin-invitation/index.ts

      - name: Test
        if: ${{ !cancelled() }}
        run: npm run test

      - name: Sales provider operation, account binding and recovery contract tests
        if: ${{ !cancelled() }}
        run: node node_modules/vitest/vitest.mjs run --config supabase/functions/_shared/sales-payments/vitest.config.ts

      - name: Invoice delivery authority and transient-link tests
        if: ${{ !cancelled() }}
        run: node node_modules/vitest/vitest.mjs run --config vitest.sales-invoice-delivery.config.ts

      # Provider-free relay proof: fake ears/runtime/mouth + UsageSink, plus
      # atomic one-use ticket and pre-upgrade auth boundary. No vendor call.
      - name: Smoke — Live Conversation relay contract and ticket (deterministic, provider-neutral)
        if: ${{ !cancelled() }}
        run: npm run smoke:live-relay && npm run smoke:live-ticket
      - name: Smoke — Live Conversation relay interpreter (fake ears/runtime/mouth, no network)
        if: ${{ !cancelled() }}
        run: npm run smoke:live-relay-bridge

      # Mock socket: falsifies either absent or false mip_opt_out before any provider contact.
      - name: Smoke — Deepgram Flux route and mandatory MIP opt-out (no network)
        if: ${{ !cancelled() }}
        run: npm run smoke:voice-stt

      # Mock fetch: approved voice/model, owner-switchable model, and no-retention flag.
      # §32 — a green build is not a working render. The 3D presence degrades to the flat presence
      # on any throw, which is correct and is also how a compiles-but-crashes bug hides: the corner
      # quietly shows 2D and nobody learns the 3D never ran. This executes the real GLB parse,
      # normal computation, material swap and framing headless, against the actual asset.
      #
      # Plain `node`, deliberately: this job runs Node 20, which has no type stripping. The matching
      # honesty assertions — that the scene may only move to real audio — import presence.ts and so
      # live in the vitest suite, where they execute, rather than here where they would have been
      # skipped in silence.
      - name: Smoke — Paige 3D presence (the real model parses, frames and materialises)
        if: ${{ !cancelled() }}
        run: npm run smoke:paige-presence-3d

      - name: Smoke — Paige voice mouth transport (no network)
        if: ${{ !cancelled() }}
        run: npm run smoke:voice-tts

      # Independent source guard for the v3 Fleet Directory. Component states run under Vitest;
      # this gate pins the authored lineage and prevents the retired orbit modules from returning.
      - name: Smoke — Fleet v3 Directory (lineage and retired-surface guard)
        if: ${{ !cancelled() }}
        run: npm run smoke:fleet-directory-v3

      - name: Smoke — comms webhook authentication (fail-closed decisions)
        if: ${{ !cancelled() }}
        run: npm run smoke:comms-webhook-auth

      # Drives the REAL comms-purchase-number handler. Unconditional, and deliberately not
      # gated on the diff touching that function: three of the four defects it pins were
      # introduced by edits ELSEWHERE (a consumer comparing the wrong field, a helper hoisted
      # to the wrong scope), which a path filter would have skipped.
      - name: Smoke — comms number purchase (money-spent exits and price verification)
        if: ${{ !cancelled() }}
        run: npm run smoke:comms-purchase-safety

      - name: Smoke — comms tenant scope (§9/§53 webhook scoping)
        if: ${{ !cancelled() }}
        run: npm run smoke:comms-tenant-scope

      # Drives the REAL manage-tenant-domain handler. Adding, re-pointing or removing
      # a sending domain changes the identity every outbound message carries, and none
      # of it left a trace until now. `deno check` proves the audit writes compile; only
      # driving the handler proves they fire on the right paths — and, just as much,
      # that a rejected verb, a foreign row and a DNS poll that found nothing write
      # NOTHING. 16 of its 20 assertions fail against the version before the change;
      # the 4 that pass are exactly those negative controls.
      - name: Smoke — sending-domain changes leave audit evidence
        if: ${{ !cancelled() }}
        run: npm run smoke:comms-domain-audit

      - name: Smoke — client-memory authorization (§9 cross-client fail-closed)
        if: ${{ !cancelled() }}
        run: npm run test:client-memory-authz

      - name: Smoke — token pricing (§18 one home; no pre-existing pairing reprices)
        if: ${{ !cancelled() }}
        run: npm run test:token-pricing

      - name: Smoke — trace cost wiring (a metered call is never recorded as free)
        if: ${{ !cancelled() }}
        run: npm run test:trace-wiring

      # INT-329 — the Claude reasoning tier is ONE constant. This drives the real claude.ts /
      # model-router seams with a recording fake Anthropic and fails if any path stops resolving
      # through CLAUDE_REASONING, if a request body drifts from the frozen pre-switch snapshot in
      # anything but `model`, if a field the reasoning model rejects leaves the seam, or if a trace
      # names anything but the model that served (or rejected) the call.
      - name: Smoke — Claude reasoning tier (one seam, frozen request shapes, truthful trace model)
        if: ${{ !cancelled() }}
        run: npm run test:reasoning-tier

      - name: Smoke — OpenAI Responses adapter (governed function tools only, chat-shaped SSE, truthful trace)
        if: ${{ !cancelled() }}
        run: npm run test:openai-responses

      - name: Smoke — active-account Knowledge scope (§9 tenant KB fail-closed)
        if: ${{ !cancelled() }}
        run: npm run test:knowledge-scope

      - name: Smoke — a document PROPOSES (only what was read is offered; the closed set is not the offer)
        if: ${{ !cancelled() }}
        run: npm run test:extraction-proposal

      - name: Smoke — approving a proposal writes only what was offered, once, as the caller
        if: ${{ !cancelled() }}
        run: npm run test:apply-extraction

      - name: Smoke — a durable write that did not land says so (postgrest resolves, it does not throw)
        if: ${{ !cancelled() }}
        run: npm run test:checked-write

      - name: Smoke — MCP registry is provider-scoped and its aggregate is deterministic
        if: ${{ !cancelled() }}
        run: npm run smoke:mcp-registry

      - name: Smoke — hardened outbound transport (SSRF, redirect refusal, bounded time and size)
        if: ${{ !cancelled() }}
        run: npm run smoke:mcp-transport

      - name: Smoke — no provider payload, injection, credential or foreign-tenant data reaches the model
        if: ${{ !cancelled() }}
        run: npm run smoke:mcp-egress

      - name: Smoke — MCP OAuth (S256 only, issuer verified, state single-use, tokens rotate)
        if: ${{ !cancelled() }}
        run: npm run smoke:mcp-oauth

      - name: Type-check — connected MCP gateway edge function (Deno)
        if: ${{ !cancelled() }}
        # The gateway's actions (verify + create + oauth_begin, and the slices to come) are Deno, so tsc
        # never sees them and the smoke below esbuild-strips types away. This deno check makes the
        # gateway's type safety CI-enforced — the same pattern the agreements functions use above (§32: a
        # green build must be a real check). The import closure pulls in every _shared/mcp-gateway/*
        # module (incl. oauth.ts). mcp-oauth-callback is the JWT-less OAuth redirect target — a SEPARATE
        # entry not imported by the gateway door, so it is checked explicitly (its closure pulls in
        # _shared/mcp-gateway/oauth-callback.ts).
        run: |
          deno check --allow-import --node-modules-dir=none supabase/functions/mcp-gateway/index.ts
          deno check --allow-import --node-modules-dir=none supabase/functions/mcp-oauth-callback/index.ts

      - name: Smoke — connected MCP gateway (intake read-only, model-safe summary, runner approval gate)
        if: ${{ !cancelled() }}
        run: npm run smoke:mcp-gateway

      - name: Smoke — paige-n8n outbound (no key to a userinfo host, bounded time and size)
        if: ${{ !cancelled() }}
        run: npm run smoke:n8n-ssrf

      - name: Smoke — no n8n webhook body, provider error or workflow definition reaches the model
        if: ${{ !cancelled() }}
        run: npm run smoke:n8n-egress

      - name: Lint — every paige_conversations insert stamps a tenant (C-7)
        if: ${{ !cancelled() }}
        run: npm run lint:conversation-tenant

      - name: Smoke — voice-twiml statusCallback (no credential to an unsigned caller)
        if: ${{ !cancelled() }}
        run: npm run smoke:voice-twiml-callback

      - name: Smoke — voice-twiml handler (nothing secret leaves on an unsigned request)
        if: ${{ !cancelled() }}
        run: npm run smoke:voice-twiml-handler

      # Appended LAST in the verify job so no existing step's ordinal shifts (§ inherited failing
      # baseline is tracked by number). One step, running the guard then its own self-test.
      - name: Mind three-state contract guard (§18/§13/§00 — one projection, fail-closed, honest absence)
        if: ${{ !cancelled() }}
        run: npm run lint:mind-contract && npm run lint:mind-contract:test
      # Appended LAST after the Mind guard (PR-P2 parity lane; same no-ordinal-shift rule —
      # if the SDK lane merged a step first, this PR syncs and re-appends after it).
      - name: Solo parity guard (INT-071 census — route stack, no solo redirect, ungated PAIGE/Command Center, no identity branches, registry snapshot)
        if: ${{ !cancelled() }}
        run: npm run lint:solo-parity && npm run lint:solo-parity:test

      # Appended LAST in verify so inherited failing-step ordinals do not move. Existing bypass
      # debt is an exact path+symbol, shrink-only snapshot; the kit's own contract is strict now.
      - name: Capability Kit contract + anti-bypass guard (INT-003)
        if: ${{ !cancelled() }}
        run: node scripts/ci/capability-kit-lint.mjs && node scripts/ci/capability-kit-lint.mjs --self-test && node --import ./scripts/capability-kit/register.mjs scripts/capability-kit/capability-kit.test.mjs

      # Appended LAST in verify so inherited failing-step ordinals do not move.
      # A job title is free text an owner types; tenant_members.role + is_owner are the enforced
      # source. This fails a replayed policy (static or from a dynamic EXECUTE template), an
      # authorization-helper-shaped function or view, or a TS decision beside an authorization
      # token that reads job_title / responsibilities, and pins every other title reader to a
      # reviewed, shrink-only baseline by migration file and body fingerprint.
      - name: Title-authority guard (no permission decision reads a job title or responsibilities)
        if: ${{ !cancelled() }}
        run: npm run lint:title-authority

      - name: Title-authority guard catches what it claims to
        if: ${{ !cancelled() }}
        run: npm run lint:title-authority:test

      # The internal-vocabulary detector (`_shared/internal-vocabulary.ts`) reads what PAIGE says for
      # text internal to the platform, with a vocabulary derived from what she was sent. Its unit tests
      # are as much about what it must leave alone (titles, contact details, links, everyday words) as
      # what it must catch. Section 29 of the client-memory-authz smoke drives it on the real handler.
      - name: Internal-vocabulary detector (catches internal text, passes ordinary customer text)
        if: ${{ !cancelled() }}
        run: npm run test:internal-vocabulary

      - name: Client-seat answer check (a client reads the withheld sentence, never internal text)
        if: ${{ !cancelled() }}
        run: npm run test:client-seat-reply

      - name: Outbound draft check (a draft for a customer carrying internal text is never filed or sent)
        if: ${{ !cancelled() }}
        run: npm run test:outbound-draft-check

      - name: Public form intake (only the platform's origins, no bots, only the form's own fields)
        if: ${{ !cancelled() }}
        run: npm run test:growth-intake

  web-fetch-hardening-smoke:
    # Its own job, deliberately on Node 22: the smoke imports the real
    # `_shared/ssrfGuard.ts`, whose `SsrfError` uses a TS parameter property that needs
    # `--experimental-transform-types` (the `verify` job runs Node 20 / strip-only mode,
    # which cannot parse it). Isolated so the `verify` job's Node pin is untouched.
    # No `npm ci`: the smoke imports only the two pure `_shared/*.ts` files + Node builtins.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Smoke — web_fetch SSRF guard refuses private/DNS-rebind/redirect/credentialed targets and fences fetched content
        run: node --experimental-transform-types scripts/web-fetch-hardening-smoke.mjs
      - name: Smoke — kb-ingest-url SSRF guard refuses DNS-rebind/private/redirect targets (canonical assertPublicHttpUrl)
        run: node --experimental-transform-types scripts/kb-ingest-url-ssrf-smoke.mjs
