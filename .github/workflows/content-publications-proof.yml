name: Content publications proof
on:
  pull_request:
    paths:
      - 'supabase/migrations/20271113870000_content_publications.sql'
      - 'supabase/tests/content_publications.sql'
      - '.github/workflows/content-publications-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-content-publications-proof:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Synthetic fixtures only; the suite's isolated-DB guard refuses any other database.
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: content_publications_contract
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGDATABASE: content_publications_contract
    steps:
      - uses: actions/checkout@v4
      - name: "EXP07 row 10 — the publication store's write path (door-only, forward-only, bind-once), reconcile-before-retry gate, member reads, tenant wall (isolated DB, never production)"
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/content_publications.sql
