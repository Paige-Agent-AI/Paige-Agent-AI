# deploy-edge-functions — keep prod edge functions in lockstep with `main`.
#
# WHY THIS EXISTS: edge functions do NOT deploy when code merges to main (unlike
# the frontend). Until this workflow, a merged classifier/prompt/shared-lib change
# kept running the OLD code in prod until someone deployed it by hand — a recurring,
# expensive, error-prone step. This closes that gap: on every push to main that
# touches supabase/functions/**, it deploys exactly the functions whose bundle
# changed (direct edits AND anything that transitively imports a changed _shared
# file — see .github/scripts/edge-affected.py) and nothing else.
#
# SETUP (one-time, owner): add a repo secret SUPABASE_ACCESS_TOKEN
#   Settings → Secrets and variables → Actions → New repository secret
#   Name: SUPABASE_ACCESS_TOKEN
#   Value: a Supabase personal access token (Supabase dashboard → Account → Access Tokens)
# Without the secret the job fails loudly with instructions — it never silently no-ops.
name: deploy-edge-functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-edge-functions.yml"
      - ".github/scripts/edge-source-readback.py"
  # A credential rotation or a stranded retirement must not wait for the next
  # functions-touching merge — an operator can drive a deploy directly.
  workflow_dispatch: {}

# Never run two prod deploys at once; let an in-flight deploy finish rather than
# cancel it half-way (a cancelled deploy could leave a subset shipped).
concurrency:
  group: deploy-edge-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to move the `edge-live` tag that records what's deployed
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need history to diff before..after

      - name: Test deployed-source verification contract
        run: python3 -B -m unittest discover -s .github/scripts -p test_edge_source_readback.py -v

      # The deployment baseline. Push: the event's before-SHA. Manual dispatch:
      # the edge-live tag — the repository's declared last-known-deployed edge
      # state. HEAD^ would be VACUOUS for recovery: a dispatch on a main whose
      # prior merge already carried the retirement resolves zero changed
      # function files, skips the retired-set computation entirely, and strands
      # the retirement again (the exact 2026-09-19 closeout class of failure).
      - name: Resolve deployment baseline
        id: baseline
        run: |
          after="${{ github.sha }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            git fetch -q --force origin "refs/tags/edge-live:refs/tags/edge-live" 2>/dev/null || true
            if ! before="$(git rev-parse refs/tags/edge-live 2>/dev/null)" || [ -z "$before" ]; then
              echo "::error::workflow_dispatch resolves its baseline from the edge-live tag, which is missing — a manual recovery cannot know what production last received."
              exit 1
            fi
            echo "manual dispatch: reconciling edge-live ($before) → HEAD ($after)"
          else
            before="${{ github.event.before }}"
            # First push / force-push / unknown parent → fall back to this commit's parent.
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
              before="$(git rev-parse "${after}^" 2>/dev/null || echo "$after")"
            fi
          fi
          echo "before=$before" >> "$GITHUB_OUTPUT"
          echo "after=$after" >> "$GITHUB_OUTPUT"

      - name: Compute changed function files
        id: changed
        run: |
          before="${{ steps.baseline.outputs.before }}"
          after="${{ steps.baseline.outputs.after }}"
          echo "before=$before" >> "$GITHUB_OUTPUT"
          echo "after=$after" >> "$GITHUB_OUTPUT"
          git diff --name-only "$before" "$after" -- 'supabase/functions/**' | tee changed.txt
          echo "count=$(grep -c . changed.txt || true)" >> "$GITHUB_OUTPUT"

      # Source deletion alone does NOT undeploy: `supabase functions deploy` only
      # creates/updates, so a retired function stays callable at the provider until
      # it is explicitly deleted. PR-A retired the legacy delete-contact edge this
      # way and taught this workflow the missing half of retirement. A function is
      # deleted only when (a) its directory existed in `before`, (b) it is gone in
      # `after`, and (c) no directory with that name exists at HEAD — a rename
      # deletes the old name only after the new one deployed, which is also correct.
      - name: Compute retired functions
        id: retired
        run: |
          if [ ! -s changed.txt ]; then
            : > retired.txt
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          before="${{ steps.changed.outputs.before }}"
          after="${{ steps.changed.outputs.after }}"
          # NOTE the braces: `{ A | grep || true; } | sort > f`. Written without
          # them, `|` binds tighter than `||` and the redirect lands in the
          # never-taken right branch — the file is silently never created,
          # comm reads nothing, and the retirement delete skips while the
          # workflow stays green. The -s guards keep that failure loud.
          { git ls-tree -d --name-only "$before" supabase/functions/ | sed 's#supabase/functions/##' | grep -v '^_' || true; } | sort > before_fns.txt
          { ls -d supabase/functions/*/ 2>/dev/null | sed 's#supabase/functions/##;s#/$##' | grep -v '^_' || true; } | sort > now_fns.txt
          [ -s before_fns.txt ] || { echo "::error::before_fns.txt is empty — the retired-set computation is broken and a retirement could be silently skipped."; exit 1; }
          comm -23 before_fns.txt now_fns.txt | tee retired.txt
          echo "count=$(grep -c . retired.txt || true)" >> "$GITHUB_OUTPUT"

      - name: Resolve affected functions
        id: affected
        run: |
          set -euo pipefail
          python3 .github/scripts/edge-affected.py < changed.txt | tee affected.txt
          # Source-only graph selection cannot see JWT, entrypoint or import-map
          # changes. Add only functions whose immutable options changed; a project
          # change cannot inherit this project's certification or deploy authority.
          python3 .github/scripts/edge-source-readback.py --select-config \
            --baseline-commit "${{ steps.baseline.outputs.before }}" \
            --expected-commit "${{ github.sha }}" --functions affected.txt
          cat affected.txt
          echo "count=$(grep -c . affected.txt || true)" >> "$GITHUB_OUTPUT"

      - name: Setup Supabase CLI
        if: steps.affected.outcome == 'success' && (steps.affected.outputs.count != '0' || steps.retired.outputs.count != '0')
        uses: supabase/setup-cli@v1
        with:
          # PINNED -- this file already anticipated pinning "if a CLI release ever
          # regresses the deploy path". The reason turned out to be different: `latest`
          # is a rate-limited network lookup, and it took down the migration deploy on
          # 2026-09-05 before that job reached any Supabase call. 2.116.0 is what
          # `latest` resolved to at pin time, so behaviour is unchanged.
          version: 2.116.0

      # ONE cheap authenticated probe BEFORE any deploy or delete, so a rejected
      # credential fails with a single actionable error instead of N deploy 401s.
      # This is the exact failure mode of 2026-09-19 (run 35408262875): the secret
      # was present but expired, every deploy returned 401, and the run ended
      # before the retirement delete could matter.
      - name: Preflight — the provider accepts the credential
        if: steps.affected.outcome == 'success' && (steps.affected.outputs.count != '0' || steps.retired.outputs.count != '0')
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is not set — cannot deploy or delete edge functions."
            echo "::error::Add it in Settings → Secrets and variables → Actions (see this workflow's header)."
            exit 1
          fi
          ref="$(sed -n 's/^project_id = "\(.*\)"/\1/p' supabase/config.toml | head -1)"
          if [ -z "$ref" ]; then echo "::error::could not read project_id from supabase/config.toml"; exit 1; fi
          if ! supabase functions list --project-ref "$ref" > /dev/null 2>&1; then
            echo "::error::The provider REJECTED SUPABASE_ACCESS_TOKEN (functions list failed)."
            echo "::error::Rotate the secret (Supabase dashboard → Account → Access Tokens → new token → update the repo secret), then re-run this workflow or use workflow_dispatch."
            exit 1
          fi
          echo "✓ credential accepted by project $ref"

      # RETIREMENT RUNS FIRST AND IS NEVER STRANDED BY A DEPLOY FAILURE. The
      # 2026-09-19 run proved the old order (deploy → delete) strands the
      # retirement: every deploy 401'd, the failed step suppressed the delete,
      # and the retired function stayed ACTIVE in production while CI merely
      # looked red. `always()` keeps the delete independent of later deploy failure,
      # but only after successful local target/config validation and retired-set
      # computation. A rejected project/configuration must never reach a mutation.
      # With that authority intact, the delete is coupled to its own inputs —
      # a retired name is absent from HEAD by construction, so it can never be
      # in the deploy set: the two steps are provably disjoint and order-safe.
      - name: Delete retired functions at the provider
        if: always() && steps.affected.outcome == 'success' && steps.retired.outcome == 'success' && steps.retired.outputs.count != '0'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is not set — cannot delete retired function(s)."
            echo "::error::The retired function(s) would remain callable in production. Add the secret or delete manually:"
            sed 's/^/  supabase functions delete /;s/$/ --project-ref <ref>/' retired.txt
            exit 1
          fi
          ref="$(sed -n 's/^project_id = "\(.*\)"/\1/p' supabase/config.toml | head -1)"
          if [ -z "$ref" ]; then echo "::error::could not read project_id from supabase/config.toml"; exit 1; fi
          fail=0
          while IFS= read -r fn; do
            [ -z "$fn" ] && continue
            echo "::group::delete $fn"
            if supabase functions delete "$fn" --project-ref "$ref" --yes; then
              echo "✓ deleted $fn at the provider (retired in source)"
            else
              echo "::error::failed to delete $fn — it may still be callable in production"
              fail=1
            fi
            echo "::endgroup::"
          done < retired.txt
          exit $fail

      - name: Deploy affected functions
        if: steps.affected.outcome == 'success' && steps.affected.outputs.count != '0'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is not set — cannot deploy edge functions."
            echo "::error::Add it in Settings → Secrets and variables → Actions (see this workflow's header)."
            exit 1
          fi
          # project_id lives in supabase/config.toml; verify_jwt per function is read
          # from config.toml too, so the CLI preserves each function's auth posture.
          ref="$(sed -n 's/^project_id = "\(.*\)"/\1/p' supabase/config.toml | head -1)"
          if [ -z "$ref" ]; then echo "::error::could not read project_id from supabase/config.toml"; exit 1; fi
          echo "Deploying $(grep -c . affected.txt) function(s) to project $ref"
          fail=0
          while IFS= read -r fn; do
            [ -z "$fn" ] && continue
            echo "::group::deploy $fn"
            if supabase functions deploy "$fn" --project-ref "$ref"; then
              echo "✓ deployed $fn"
            else
              echo "::error::failed to deploy $fn"
              fail=1
            fi
            echo "::endgroup::"
          done < affected.txt
          exit $fail

      # A successful upload is not evidence that the selected source is live.
      # Reuse this job's authenticated CLI; download only into temporary dirs.
      # Readback failure does not roll back already successful deployments.
      - name: Verify deployed source
        id: readback
        if: steps.affected.outcome == 'success' && steps.affected.outputs.count != '0'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          python3 .github/scripts/edge-source-readback.py \
            --expected-commit "${{ github.sha }}" \
            --functions affected.txt \
            --report edge-source-readback.json

      - name: Retain selected-source verification result
        if: always() && steps.affected.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: edge-source-readback-${{ github.sha }}
          path: edge-source-readback.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Record deployed commit
        if: success() && (steps.affected.outputs.count == '0' || steps.readback.outcome == 'success') && (steps.affected.outputs.count != '0' || steps.retired.outputs.count != '0')
        run: |
          # `edge-live` always points at the last commit whose functions are live in
          # prod. /edge-drift diffs edge-live..HEAD to show what's ahead of prod.
          # A previous partial/failed release must not be skipped by the next
          # push's narrower before..after selection. Frontend-only intervening
          # commits are fine. Existing workflow_dispatch reconciles a real gap
          # from edge-live without changing deploy/retirement behavior here.
          verified_before="$(git rev-parse --verify refs/tags/edge-live)"
          if ! git diff --quiet "$verified_before" "${{ steps.baseline.outputs.before }}" -- supabase/functions; then
            echo "::error::Prior Edge source is unverified; use the existing workflow_dispatch recovery before advancing edge-live. Successful selected deployments remain live."
            exit 1
          fi
          # Compare actual certified tag -> target, not manual before -> edge-live
          # (the same commit). Every changed live function configuration must have
          # been selected for this job's successful deployed-source readback.
          python3 .github/scripts/edge-source-readback.py --require-config-coverage \
            --baseline-commit "$verified_before" \
            --expected-commit "${{ github.sha }}" --functions affected.txt
          git tag -f edge-live "${{ github.sha }}"
          git push -f origin edge-live
