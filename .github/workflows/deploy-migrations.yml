# Temporary branch-only audit. Never merge this replacement workflow.
name: INT-339 read-only authentication readiness
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auth-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read sanitized production Auth readiness
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          url = 'https://api.supabase.com/v1/projects/xygzykjyynhzqytbqnzu/config/auth'
          request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['SUPABASE_ACCESS_TOKEN']})
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, msg, headers, newurl):
                  return None
          opener = urllib.request.build_opener(NoRedirect)
          try:
              with opener.open(request, timeout=30) as response:
                  config = json.load(response)
          except urllib.error.HTTPError as error:
              print('AUTH_CONFIG_HTTP_STATUS=' + str(error.code))
              raise SystemExit(1)
          except Exception:
              print('AUTH_CONFIG_READ_FAILED')
              raise SystemExit(1)
          print('AUTH_CONFIG_READ=PASS')
          for key in sorted(config):
              if (key.startswith('hook_') and key.endswith('_enabled')) or key in ('external_email_enabled', 'disable_signup'):
                  value = config[key]
                  if type(value) is not bool:
                      print('AUTH_CONFIG_BOOLEAN_SHAPE_INVALID')
                      raise SystemExit(1)
                  print(key + '=' + str(value).lower())
          for key in sorted(config):
              if key.startswith('hook_') and key.endswith('_uri'):
                  value = config[key]
                  kind = 'EMPTY' if not value else 'POSTGRES' if value.startswith('pg-functions://') else 'HTTPS' if value.startswith('https://') else 'OTHER'
                  print(key + '_kind=' + kind)
          PY
