name: Finance source proof
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: finance-source-proof-${{ github.ref }}
  cancel-in-progress: true
jobs:
  postgres-authority:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres@sha256:75adc2a65806c96bc0e59030230bfe3f1c1b0d6d8f8181a8913e2b8b53bdc166
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Actual Finance migration, failing-first, repeated fresh replay and concurrent isolation
        run: node scripts/proof/finance-source-authority.mjs
      - name: Actual account source projection, nullable amounts and revoked-source erasure
        run: node scripts/proof/finance-source-authority.mjs accounts
      - name: Actual lender source projection, account-version evidence and liability meaning
        run: node scripts/proof/finance-source-authority.mjs liabilities
