name: Migration E studio publish catalogue
on:
  pull_request:
    paths:
      - 'supabase/migrations/20270548000000_studio_publish_autonomy_catalogue.sql'
      - 'supabase/migrations/20270546000000_studio_content_workspace_authority.sql'
      - 'supabase/migrations/20270547000002_sales_collection_autonomy_catalogue.sql'
      - 'supabase/tests/migration_e_studio_publish_catalogue.sql'
      - '.github/workflows/migration-e-studio-publish-catalogue.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-catalogue-proof:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Synthetic fixtures only; the suite's isolated-DB guard refuses any other database.
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: migration_e_studio_publish_catalogue_contract
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGDATABASE: migration_e_studio_publish_catalogue_contract
    steps:
      - uses: actions/checkout@v4
      - name: Migration E — Rail lines, autonomy catalogue, grants (isolated DB, never production)
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/migration_e_studio_publish_catalogue.sql
