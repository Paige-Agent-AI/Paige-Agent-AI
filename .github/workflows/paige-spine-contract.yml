      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/mcp_gateway_oauth_state_and_hardenings.sql postgresql://postgres:postgres@127.0.0.1:54322/postgres
      # Paige can SEE her MCP connections (migration 20270410214500). list_integration_surface read
      # ONLY channel_connectors, so every MCP connection a tenant owned was invisible to her — absent,
      # not stale. Proves: the channel_connectors half is untouched (§58, incl. from_address/
      # inbound_address); a LIVE legacy row BEATS its own frozen projection and is listed exactly ONCE
      # — precedence keys on the lineage columns the one-time backfill writes, NEVER on a provider
      # name, because a projection is a stale snapshot OF the live row and letting it win reports a
      # connection the owner just disconnected as still live; a NATIVE gateway row (legacy_source NULL)
      # survives that suppression; the live n8n API-key facet likewise beats its projection, host-only;
      # a LIVE legacy connection the backfill never projected is STILL listed — without it Paige
      # answers "you are not connected" about a working connection; the owner_only gate survives being
      # reached through a nested SECURITY DEFINER call (§9, proven from both the admin and the
      # ordinary-member side); and no credential material crosses. Rides this replayed DB for the same
      # §24 reason as above.
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/integrations_surface_sees_mcp.sql postgresql://postgres:postgres@127.0.0.1:54322/postgres
      # There must be exactly ONE public.record_capability_run (migration 20270411090000).
      # 20270107000000 added four trailing params as a NEW signature instead of replacing the
      # old one, and issued no DROP — so BOTH were live with defaults past the fifth argument,
      # and every five-argument call (which is what all three service-role edge callers send)
      # failed 42725 "function is not unique" straight into a swallowed console.error. This
      # counts the overloads and PREPAREs the real five-named and ten-positional calls, so the
