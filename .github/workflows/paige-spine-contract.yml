      # uuid crosses — checked by VALUE so a rename cannot defeat it.
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/mcp_tool_catalog_tenant_scope.sql postgresql://postgres:postgres@127.0.0.1:54322/postgres
      # The OAuth flow must refuse the REST facet, or it overwrites an unrecoverable API key.
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/mcp_oauth_refuses_the_rest_facet.sql postgresql://postgres:postgres@127.0.0.1:54322/postgres
      # Connected MCP Gateway — Slice ② OAuth GRANT WRITER (migration 20270333000000): complete_mcp_oauth_grant
      # re-keys a 'none' shell to oauth (tokens ENCRYPTED, granted scopes recorded, status→pending_verification,
