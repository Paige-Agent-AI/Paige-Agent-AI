      # switching the Rail off again. Rides this replayed DB for the same §24 reason as above.
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/record_capability_run_single_overload.sql postgresql://postgres:postgres@127.0.0.1:54322/postgres
      # Door 1 (migration 20270412090000): a tenant reads its OWN tool catalogue and nothing
      # else. The obvious implementation — mirror get_mcp_connections_v2 — is WRONG and leaks
      # every tenant to every other: v2's isolation lives in its WHERE tenant_id LIST filter,
      # which a by-id read does not have, and _mcp_resolve_tenant scopes the CALLER, never the
      # ROW. Proven live during the build: with the bind removed, a tenant-A member read tenant
      # B's tools outright. This pins that bind, the owner_only re-check after it, one identical
