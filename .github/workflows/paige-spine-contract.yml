      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/mcp_gateway_oauth_grant_writer.sql postgresql://postgres:postgres@127.0.0.1:54322/postgres
      # Connected MCP Gateway — the approval future-expiry TRIGGER (migration 20270334000000, Codex P2).
      # Proves trg_mcp_reject_past_approval_expiry refuses a non-future expires_at atomically at write
