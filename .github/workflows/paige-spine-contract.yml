name: PAIGE Spine contract

on:
  # workflow_dispatch lets a bot-authored PR obtain these REQUIRED checks (contract +
  # database-contract) on an EXACT ref when the pull_request/push Actions events are suppressed
  # (bot recursion prevention) — the same CI-reliability pattern #1191 added to ci.yml. Both jobs
  # use a plain `actions/checkout@v4`, which defaults to `github.ref`, so dispatching on the PR
  # branch runs the full contract against that branch's head. No job logic changes; no check is
  # weakened, skipped, or de-required — this only adds a way to TRIGGER the same gate on demand.
  workflow_dispatch:
  pull_request:
    paths:
      - "supabase/functions/_shared/paige-spine/**"
      - "supabase/migrations/**"
      - "supabase/tests/mcp_gateway_endpoint_revokes_approvals.sql"
      - "supabase/tests/mcp_gateway_durable_endpoint_bound_consent.sql"
      - "supabase/tests/mcp_gateway_url_auth_configured.sql"
      - "supabase/tests/mcp_gateway_endpoint_load_binding.sql"
      - "supabase/tests/mcp_gateway_owner_only_visibility.sql"
      - "supabase/tests/mcp_gateway_endpoint_setter.sql"
      - "supabase/tests/mcp_gateway_connection_create.sql"
      - "supabase/tests/mcp_gateway_oauth_state_and_hardenings.sql"
      - "supabase/tests/mcp_gateway_oauth_grant_writer.sql"
      - "supabase/tests/mcp_gateway_approval_future_expiry.sql"
      - "supabase/tests/integrations_surface_sees_mcp.sql"
      - "supabase/tests/record_capability_run_single_overload.sql"
      - "supabase/tests/mcp_tool_catalog_tenant_scope.sql"
      - "supabase/tests/mcp_oauth_refuses_the_rest_facet.sql"
      - "supabase/migrations/20270412090000_a_tenant_can_read_its_own_tool_catalog.sql"
      - "supabase/migrations/20270411090000_one_record_capability_run_not_two.sql"
      - "scripts/proof/mcp-gateway-endpoint-consent-race.mjs"
      - "supabase/functions/_shared/mcp-gateway/**"
      - "supabase/functions/paige-tts/**"
      - "supabase/tests/paige_voice_budget_control.sql"
      - "supabase/tests/paige_live_pilot_feature_guard.sql"
      - "supabase/tests/paige_live_runtime_claim.sql"
      - "supabase/tests/paige_live_session_transition.sql"
      - "scripts/proof/paige-voice-budget-concurrency.mjs"
      - "supabase/tests/paige_spine_foundation.sql"
      - "supabase/tests/governed_crm_commands.sql"
      # The CRM patch-schema proof and the generator that writes it. (`supabase/migrations/**`
      # above already re-runs this job when an allowlist itself changes, which is the case that
      # matters most; these two cover a change to the proof or to how it is derived.)
      - "supabase/tests/crm_patch_fields_match_database.sql"
      - "scripts/ci/crm-patch-field-gen.mjs"
      - "supabase/tests/media_credit_ledger.sql"
      - "supabase/tests/business_context_readiness.sql"
      - "supabase/tests/team_authority_readiness.sql"
      - "supabase/tests/business_mission_foundation.sql"
      - "supabase/tests/social_foundation.sql"
      - "supabase/tests/social_foundation_rls.sql"
      - "scripts/sql/social-foundation-legacy-shape-proof.sql"
      - "scripts/sql/social-foundation-tenant-shaped-proof.sql"
      - "supabase/tests/source_thread_link_scope.sql"
      - "supabase/functions/_shared/source-thread-link.ts"
      # The Solo Team invitation proof must re-run when the seam it proves changes,
      # not only when a migration happens to touch it.
      - "supabase/tests/solo_team_invite_workspace_authority.sql"
      - "supabase/tests/solo_setup_completion_marker.sql"
      - "supabase/tests/canonical_solo_provisioning.sql"
      - "supabase/tests/solo_team_invite_recipient_binding.sql"
      # Same reason for the removal proof: it must re-run when the seam changes.
      - "supabase/tests/solo_team_removal_authority.sql"
      - "supabase/functions/solo-team-invitations/**"
      - "supabase/functions/handle-resend-webhook/**"
      - "supabase/tests/resend_receipt_reliability.sql"
      - "supabase/tests/promotional_solo_grant.sql"
      # Layer C · C5 slice 2 — companion-minting + cancellation-sync + direct-approve guard + reconciler.
      # Re-run when the proof or the orchestration seams it covers change, not only when a migration touches it.
      - "supabase/tests/paige_orchestration_companion_minting.sql"
      - "supabase/functions/_shared/paige-orchestration/**"
      - "supabase/functions/execute-approval/**"
      - "scripts/proof/resend-receipt-concurrency.mjs"
      - "scripts/proof/business-mission-concurrency.mjs"
      - "src/__tests__/paige-spine-*.test.ts"
      - "src/__tests__/paige-orchestration-approve-executor.test.ts"
      - "src/solo/paigeClientScope.ts"
      - "src/solo/paigeClientScope.test.ts"
      - "scripts/ci/paige-spine-registry-lint.mjs"
      - "scripts/ci/chat-tool-registry-lint.mjs"
      - "scripts/proof/paige-spine-local-proof.sql"
      - ".github/workflows/paige-spine-contract.yml"
  push:
    branches: [main]
    paths:
      - "supabase/functions/_shared/paige-spine/**"
      - "supabase/migrations/**"
      - "supabase/tests/mcp_gateway_endpoint_revokes_approvals.sql"
      - "supabase/tests/mcp_gateway_durable_endpoint_bound_consent.sql"
      - "supabase/tests/mcp_gateway_url_auth_configured.sql"
      - "supabase/tests/mcp_gateway_endpoint_load_binding.sql"
      - "supabase/tests/mcp_gateway_owner_only_visibility.sql"
      - "supabase/tests/mcp_gateway_endpoint_setter.sql"
      - "supabase/tests/mcp_gateway_connection_create.sql"
      - "supabase/tests/mcp_gateway_oauth_state_and_hardenings.sql"
      - "supabase/tests/mcp_gateway_oauth_grant_writer.sql"
      - "supabase/tests/mcp_gateway_approval_future_expiry.sql"
      - "supabase/tests/integrations_surface_sees_mcp.sql"
      - "supabase/tests/record_capability_run_single_overload.sql"
      - "supabase/tests/mcp_tool_catalog_tenant_scope.sql"
      - "supabase/tests/mcp_oauth_refuses_the_rest_facet.sql"
      - "supabase/migrations/20270412090000_a_tenant_can_read_its_own_tool_catalog.sql"
      - "supabase/migrations/20270411090000_one_record_capability_run_not_two.sql"
      - "scripts/proof/mcp-gateway-endpoint-consent-race.mjs"
      - "supabase/functions/_shared/mcp-gateway/**"
      - "supabase/functions/paige-tts/**"
      - "supabase/tests/paige_voice_budget_control.sql"
      - "supabase/tests/paige_live_pilot_feature_guard.sql"
      - "supabase/tests/paige_live_runtime_claim.sql"
      - "supabase/tests/paige_live_session_transition.sql"
      - "scripts/proof/paige-voice-budget-concurrency.mjs"
      - "supabase/tests/paige_spine_foundation.sql"
      - "supabase/tests/governed_crm_commands.sql"
      # The CRM patch-schema proof and the generator that writes it. (`supabase/migrations/**`
      # above already re-runs this job when an allowlist itself changes, which is the case that
      # matters most; these two cover a change to the proof or to how it is derived.)
      - "supabase/tests/crm_patch_fields_match_database.sql"
      - "scripts/ci/crm-patch-field-gen.mjs"
      - "supabase/tests/media_credit_ledger.sql"
      - "supabase/tests/business_context_readiness.sql"
      - "supabase/tests/team_authority_readiness.sql"
      - "supabase/tests/business_mission_foundation.sql"
      - "supabase/tests/social_foundation.sql"
      - "supabase/tests/social_foundation_rls.sql"
      - "scripts/sql/social-foundation-legacy-shape-proof.sql"
      - "scripts/sql/social-foundation-tenant-shaped-proof.sql"
      - "supabase/tests/source_thread_link_scope.sql"
      - "supabase/functions/_shared/source-thread-link.ts"
      # The Solo Team invitation proof must re-run when the seam it proves changes,
      # not only when a migration happens to touch it.
      - "supabase/tests/solo_team_invite_workspace_authority.sql"
      - "supabase/tests/solo_setup_completion_marker.sql"
      - "supabase/tests/canonical_solo_provisioning.sql"
      - "supabase/tests/solo_team_invite_recipient_binding.sql"
      # Same reason for the removal proof: it must re-run when the seam changes.
      - "supabase/tests/solo_team_removal_authority.sql"
      - "supabase/functions/solo-team-invitations/**"
      - "supabase/functions/handle-resend-webhook/**"
      - "supabase/tests/resend_receipt_reliability.sql"
      - "supabase/tests/promotional_solo_grant.sql"
      # Layer C · C5 slice 2 — companion-minting + cancellation-sync + direct-approve guard + reconciler.
      - "supabase/tests/paige_orchestration_companion_minting.sql"
      - "supabase/functions/_shared/paige-orchestration/**"
      - "supabase/functions/execute-approval/**"
      - "scripts/proof/resend-receipt-concurrency.mjs"
      - "scripts/proof/business-mission-concurrency.mjs"
      - "src/__tests__/paige-spine-*.test.ts"
      - "src/__tests__/paige-orchestration-approve-executor.test.ts"
      - "src/solo/paigeClientScope.ts"
      - "src/solo/paigeClientScope.test.ts"
      - "scripts/ci/paige-spine-registry-lint.mjs"
      - "scripts/ci/chat-tool-registry-lint.mjs"
      - "scripts/proof/paige-spine-local-proof.sql"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --experimental-strip-types scripts/ci/paige-spine-registry-lint.mjs --self-test
      - run: node --experimental-strip-types scripts/ci/paige-spine-registry-lint.mjs
      # The two per-capability Chat-evidence proofs are listed explicitly. The path filter above
      # already matches src/__tests__/paige-spine-*.test.ts, so omitting them here meant this
      # workflow ran on their changes without running them — they were only covered by the
      # repo-wide vitest in `verify`. A proof a workflow claims to gate and does not run is worse
      # than one it never claimed.
      - run: npx vitest run src/__tests__/paige-spine-registry.test.ts src/__tests__/paige-spine-sql-contract.test.ts src/__tests__/paige-spine-chat-binding.test.ts src/__tests__/paige-spine-mind-binding.test.ts src/__tests__/paige-spine-business-context-readiness.test.ts src/__tests__/paige-spine-team-authority.test.ts src/__tests__/paige-spine-business-mission.test.ts src/solo/paigeClientScope.test.ts

  database-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector
      - run: supabase db reset
      # Third-party speech availability is platform-owned, distinct from the
      # caller's existing tenant membership/role and Paige thread entitlement.
      - run: supabase test db supabase/tests/paige_live_pilot_feature_guard.sql
      - run: supabase test db supabase/tests/paige_live_runtime_claim.sql
      - run: supabase test db supabase/tests/paige_live_session_transition.sql
      # Governed CRM/Pipeline: tenant, authority, idempotency, destructive preview, readback, and Rail proof.
      - run: supabase test db supabase/tests/governed_crm_commands.sql
      # The patch field list Paige is SHOWN must equal the allowlist that REFUSES her patch. On
      # 2026-09-25 it did not: she sent `company_name`/`zip`, the executor accepts
      # `entity_name`/`zip_code`, and an approved contact create died as
      # CRM_PATCH_FIELDS_INVALID:company_name,zip with nothing in the tool schema to tell her
      # otherwise. `npm run lint:crm-patch-fields` already re-derives the seven lists by slicing
      # migration TEXT; this proof is the half that asks POSTGRES instead, against the database
      # `db reset` just replayed — so the definition Postgres actually resolves is the authority,
      # not a filename-sort heuristic. Both artifacts are generated together, so they cannot
      # disagree without one of the two guards going red.
      # MEASURED 2026-09-26, and the reason this one step carries a condition its neighbours
      # do not: this job has failed at its FIRST test step since 2026-09-24 (#1448 removed the
      # Live pilot envelope and left paige_live_pilot_feature_guard.sql asserting it — 22/140,
      # identical failures on main run 36034621731 and on this branch). `bash -e` aborts the job
      # there, so all 28 proof steps after it, this one included, have not executed in CI for two
      # days. A proof a workflow claims to gate and does not run is worse than one it never
      # claimed — the comment twelve lines into the `contract` job above says exactly that. This
      # makes THIS proof report its own result; it weakens nothing (a failure here still fails
      # the job). The stale guard, and un-darkening the other 27, are filed as their own item
      # rather than fixed from this lane.
      - run: supabase test db supabase/tests/crm_patch_fields_match_database.sql
        if: ${{ !cancelled() }}
      - run: supabase test db supabase/tests/paige_spine_foundation.sql
      # Vibe Media Credit Ledger: append-only, closure math, anti-leakage release
      # gate, lazy mint, RLS, and the §59 service-role surface (2026-09-12).
      - run: supabase test db supabase/tests/media_credit_ledger.sql
      # Behavioural proof for the Solo Team invitation seam, against the schema `db reset` just
      # replayed from zero. It rides this job deliberately rather than standing up a second
      # Postgres: the expensive part is `supabase start` + `db reset`, and duplicating it to run
      # one more file would double a 20-minute job for nothing (§24).
      # #826: the setup-completion marker trigger — save fires, registration
      # alone does not (the MAJOR-1 scope), failed saves roll back.
      - run: supabase test db supabase/tests/solo_setup_completion_marker.sql
      # PR3 Canonical Parity: every Solo producer creates a canonically
      # routable tenant by construction; broken shapes fail closed.
      - run: supabase test db supabase/tests/canonical_solo_provisioning.sql
      - run: supabase test db supabase/tests/solo_team_invite_workspace_authority.sql
      - run: supabase test db supabase/tests/solo_team_invite_recipient_binding.sql
      - run: supabase test db supabase/tests/solo_team_removal_authority.sql
      - run: supabase test db supabase/tests/solo_team_invite_lifecycle.sql
      # Solo Beta acquisition rides the same freshly replayed database. These two files prove
      # that ordinary browser callers cannot use generic provisioning or cross-user status reads,
      # and that the fixed offer/atomic fulfillment functions retain their least-privilege grants.
      - run: supabase test db supabase/tests/solo_beta_authz_hardening.sql
      - run: supabase test db supabase/tests/solo_beta_offer_boundary.sql
      - run: supabase test db supabase/tests/solo_beta_welcome_lifecycle.sql
      # Platform-issued promotional Solo access is a separate service-only lane:
      # no Stripe binding, one explicit grant, one workspace, and retry-safe receipts.
      - run: supabase test db supabase/tests/promotional_solo_grant.sql
      # Layer C · C5 slice 2 — the companion-mint trigger's column contract + idempotency, the
      # cancellation-sync (reject/skip → cancelled, never clobbering an executed act), the direct-approve
      # guard (an orchestration approval reaches approved only via the executor's act_outcome stamp), and the
      # durable reconciler (landed correlation → executed; >24h unconfirmed → failed; fresh/recent left as-is;
      # §59 in-body JWT-caller refusal). Rides this replayed DB for the same §24 reason as the proofs above.
      - run: supabase test db supabase/tests/paige_orchestration_companion_minting.sql
      - run: supabase test db supabase/tests/resend_receipt_reliability.sql
      - run: node scripts/proof/resend-receipt-concurrency.mjs
        env:
          RECEIPT_TEST_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      # The business_context.readiness contract: grant surface, both caller paths, and the role
      # gate that a tenant-isolation-only proof cannot see (a workspace's own client is an
      # authenticated user of that same tenant). Rides this job for the same reason as the two
      # above — the expensive part is `supabase start` + `db reset` (§24).
      - run: supabase test db supabase/tests/business_context_readiness.sql
      - run: supabase test db supabase/tests/secure_browser_control_plane_security.sql
      # The team.authority contract. Its load-bearing fixture is a caller who is the legal owner of
      # ANOTHER workspace while holding a plain member seat in their active one — the one shape that
      # makes a dropped is_tenant_owner() tenant argument, and a collapsed permission field, fail
      # loudly. Every real member on production has the two agreeing, so a proof built on
      # real-shaped data alone would pass while either defect shipped.
      - run: supabase test db supabase/tests/team_authority_readiness.sql
      # Business Mission owner/RLS/lifecycle proof and true concurrent replay/CAS proof.
      - run: supabase test db supabase/tests/business_mission_foundation.sql
      - run: supabase test db supabase/tests/social_foundation.sql
      - run: supabase test db supabase/tests/social_foundation_rls.sql
      - run: supabase test db supabase/tests/social_connection_lifecycle.sql
      # coach_clients status consistency (migration 20270426000000): six policies honour an
      # assignment only while it is active, and reactivation restores access. Carries the same
      # `!cancelled()` condition as the CRM patch proof above, for the same measured reason: the
      # job's first test step is red on main, and without it this proof would never execute.
      - run: supabase test db supabase/tests/coach_clients_status_consistency.sql
        if: ${{ !cancelled() }}
      # Assigned-staff relationships belong to exactly one tenant: structural client link, validated
      # assignee, suspend/restore on membership change, and no direct writes outside assignment.
      - run: supabase test db supabase/tests/assigned_staff_relationship_scope.sql
        if: ${{ !cancelled() }}
      # Client memory belongs to exactly one tenant: filled from the client record or the writer's
      # active tenant, refused otherwise, fixed once written, and visible only within that tenant.
      - run: supabase test db supabase/tests/client_memory_tenant_scope.sql
        if: ${{ !cancelled() }}
      # Report uploads and their stored files belong to exactly one tenant; staff reach a file only
      # through its upload record, and file the record before the file.
      - run: supabase test db supabase/tests/credit_report_upload_tenant_scope.sql
        if: ${{ !cancelled() }}
      # A device's push subscription belongs to one business; a subscription with no business
      # matches none; the person manages their own.
      - run: supabase test db supabase/tests/push_subscription_tenant_scope.sql
        if: ${{ !cancelled() }}
      # Staff name resolution carries only what callers show, is read-only, and stays inside the
      # business.
      - run: supabase test db supabase/tests/coach_client_profiles_safe_projection.sql
        if: ${{ !cancelled() }}
      - run: psql -v ON_ERROR_STOP=1 -f scripts/sql/social-foundation-legacy-shape-proof.sql postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - run: psql -v ON_ERROR_STOP=1 -f scripts/sql/social-foundation-tenant-shaped-proof.sql postgresql://postgres:postgres@127.0.0.1:54322/postgres
      # Trusted task↔thread link — RLS SET-ROLE proof that the edge's server-side validation read
      # (id + tenant + caller_user_id) denies a cross-tenant/forged/account-switched thread, and that
      # a foreign source_thread_id grants no discovery of the linked conversation (§9/§13). Rides this
      # job for the same §24 reason as the proofs above — the cost is `supabase start` + `db reset`.
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/source_thread_link_scope.sql postgresql://postgres:postgres@127.0.0.1:54322/postgres
      # Connected MCP Gateway — changing a connection's stored endpoint revokes its approvals, the
      # connection-keyed twin of _mcp_revoke_approvals_on_endpoint_change (migration 20270322000000).
      # Proves a non-endpoint edit and a same-address re-encryption do NOT revoke; a re-point and a
      # disconnect DO; and the DELETE is scoped to the one connection_id (a sibling is untouched).
      # Rides this replayed DB for the same §24 reason as the proofs above.
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/mcp_gateway_endpoint_revokes_approvals.sql postgresql://postgres:postgres@127.0.0.1:54322/postgres
      # Connected MCP Gateway — Phase C durable, endpoint-bound consent (migration 20270323000000,
      # #1262 findings 2/3). Proves the writer binds the current endpoint and refuses an endpoint-less
      # connection; verify_mcp_connection_approval authorizes only a stored approval whose pin +
      # endpoint identity (+ optional action shape, unexpired) still hold — endpoint_changed,
      # contract_changed, approval_not_endpoint_bound, approval_expired, action_shape_changed; and the
      # writer's §9 tenant guard refuses a cross-tenant connection while allowing the same-tenant one.
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/mcp_gateway_durable_endpoint_bound_consent.sql postgresql://postgres:postgres@127.0.0.1:54322/postgres
      # Connected MCP Gateway — a url-auth (credential-in-URL) connection is CONFIGURED (INT-079,
      # migration 20270326000000). Proves get_mcp_connection_secret resolves a url row (server_url_ct
      # present, both tokens null, auth_kind='url') configured:true — load-bearing against the prior
      # `<> 'none'` guard — while a bearer row with no tokens and a url row with no endpoint both stay
      # configured:false (fail-closed preserved).
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/mcp_gateway_url_auth_configured.sql postgresql://postgres:postgres@127.0.0.1:54322/postgres
      # Connected MCP Gateway — consent is bound to the LOADED endpoint (INT-078, migration 20270327000000).
      # Proves get_mcp_connection_secret returns endpoint_hash, and verify_mcp_connection_approval refuses
      # endpoint_load_mismatch when the loaded endpoint differs from the approved one EVEN THOUGH the row's
      # current endpoint still matches (the load-bearing TOCTOU catch), keeps endpoint_changed for a moved
      # row, and refuses loaded_endpoint_hash_required when the required loaded hash is NULL/empty.
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/mcp_gateway_endpoint_load_binding.sql postgresql://postgres:postgres@127.0.0.1:54322/postgres
      # Connected MCP Gateway — owner_only visibility is caller-authority enforced (INT-082/INT-089,
      # migration 20270328000000). Proves get_mcp_connection_secret returns `visibility` (and STILL
      # returns endpoint_hash — the 4th replace did not drop INT-078), and that the single mapping
      # _mcp_caller_capabilities grants mcp.connections.use_restricted to owner + admin + platform owner
      # (and, per INT-099, mcp.connections.manage to owner + admin only — never a platform owner),
      # holds NOTHING for an ordinary member (even one carrying a global staff role — §59 trap), a NULL
      # actor (no service-role bypass), and a different tenant's owner (§9).
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/mcp_gateway_owner_only_visibility.sql postgresql://postgres:postgres@127.0.0.1:54322/postgres
      # Connected MCP Gateway — the endpoint setter (INT-099, migration 20270330000000). Proves the
      # re-bind invariant (a changed endpoint never inherits the old secret; approvals revoked through
      # the setter; A→B→A no resurrection), the mcp.connections.manage capability gate (owner/tenant-admin
      # only; platform owner excluded, A2; member / cross-tenant / NULL-actor refused), the D1 legacy-row
      # refusal, the same-transaction hashes-only paige_audit_log write with audit-fail⇒no-commit (A1),
      # the write-only return (A3), and the static https/SSRF URL validation (A4).
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/mcp_gateway_endpoint_setter.sql postgresql://postgres:postgres@127.0.0.1:54322/postgres
      # Connected MCP Gateway — the registry-native connection WRITERS (G1a-1, migration 20270331000000).
      # Proves create_mcp_connection / create_mcp_rest_connection (accept/reject matrix, F4 credential-bundle
      # enumeration, REST lane), disconnect_mcp_connection (soft disable incl. the url-embedded credential
      # scrub + hard delete with receipt/Rail history survival), the mcp.connections.delete capability gate,
      # re-key = reconnect (enabled restored), get_mcp_connections_v2.configured honest for url/none, and the
      # §51 per-tier write matrix + A1/A3 no-leak. Rides this replayed DB for the same §24 reason as above.
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/mcp_gateway_connection_create.sql postgresql://postgres:postgres@127.0.0.1:54322/postgres
      # Connected MCP Gateway — Slice ② foundation (migration 20270332000000): the OAuth-state store
      # (begin/consume single-use + encrypted verifier + expiry + §9 cross-tenant refusal), INT-152
      # (config_generation trigger bump on endpoint/credential/status-reset — never on a probe result;
