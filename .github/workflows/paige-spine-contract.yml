      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/mcp_gateway_approval_future_expiry.sql postgresql://postgres:postgres@127.0.0.1:54322/postgres
      # PAIGE Voice V1a — capability-gated zero/disabled configuration, tenant + platform
