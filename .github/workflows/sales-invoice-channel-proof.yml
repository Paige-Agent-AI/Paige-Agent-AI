name: Sales invoice channel SQL proof
on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/_shared/sales-invoice-delivery/**'
      - 'supabase/functions/send-message/**'
      - 'scripts/sql/sales-invoice-channel-proof.*'
      - 'scripts/sql/sales-governed-draft-proof.*'
      - 'supabase/functions/_shared/sales-commercial/**'
      - 'supabase/functions/sales-invoice-draft-command/**'
      - '.github/workflows/sales-invoice-channel-proof.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/_shared/sales-invoice-delivery/**'
      - 'scripts/sql/sales-invoice-channel-proof.*'
      - 'scripts/sql/sales-governed-draft-proof.*'
      - 'supabase/functions/_shared/sales-commercial/**'
      - 'supabase/functions/sales-invoice-draft-command/**'
      - '.github/workflows/sales-invoice-channel-proof.yml'
permissions:
  contents: read
jobs:
  channel-sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: isolated-test-password
        ports: ['56348:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Actual channel migration, isolation, recovery and admission race
        env:
          PGPASSWORD: isolated-test-password
        run: node scripts/sql/sales-invoice-channel-proof.mjs "$(command -v psql)" 56348 postgres /var/lib/postgresql/data
      - name: Actual governed draft migration, Trust, atomic receipt and competing revisions
        env:
          PGPASSWORD: isolated-test-password
        run: node scripts/sql/sales-governed-draft-proof.mjs "$(command -v psql)" 56348 postgres /var/lib/postgresql/data --draft-concurrency

