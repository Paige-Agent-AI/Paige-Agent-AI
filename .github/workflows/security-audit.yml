name: Security Audit

# Fails the build on any new high/critical severity vulnerability in
# production dependencies. Kept strict on purpose — see security-memory.
#
# NOTE: `package-lock.json` is COMMITTED, and `npm audit` reads it directly (no
# node_modules needed). This audits the tree the npm/CI lane actually installs,
# rather than one re-resolved from the registry at audit time.
#
# Caveat worth knowing: `bun.lockb` is what PRODUCTION installs from
# (vercel.json pins `installCommand: bun install`) and `npm audit` cannot read
# it, so the two lockfiles can drift. Converging them is a tracked follow-up.

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  # Identical locked dependency audit for the exact manually requested ref.
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The lockfile-generation step that used to sit here is gone. It ran
      # `npm install --package-lock-only`, which RE-RESOLVED every dependency from the registry —
      # so the audit graded a freshly-resolved tree rather than the one we actually ship, and a
      # newly-published upstream version could change the verdict with no commit. package-lock.json
      # is now committed, and `npm audit` reads it directly with no node_modules required.

      - name: Run npm audit (production deps only, high+)
        # Dev-only vulns (vitest/vite/eslint toolchain) don't reach the
        # published bundle and are tracked separately. We keep prod strict.
        run: npm audit --omit=dev --audit-level=high
