name: Social presence connection readiness proof
on:
  pull_request:
    paths:
      - 'supabase/migrations/20271113860000_social_presence_connection_readiness.sql'
      - 'supabase/tests/social_presence_connection_readiness.sql'
      - '.github/workflows/social-presence-readiness-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-presence-readiness-proof:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Synthetic fixtures only; the suite's isolated-DB guard refuses any other database.
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: social_presence_connection_readiness_contract
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGDATABASE: social_presence_connection_readiness_contract
    steps:
      - uses: actions/checkout@v4
      - name: EXP07 row 9 — presence + connection readiness merge through the one governed read: owner/admin-gated as before, client refused with no readiness leaked, tenant wall proven, absence stays absence (isolated DB, never production)
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/social_presence_connection_readiness.sql
