<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teach CURA — local flow prototype</title><style>
@font-face{font-family:"Schibsted Grotesk";src:url("/fonts/schibsted-grotesk/schibsted-grotesk-latin-wght-normal.woff2") format("woff2");font-weight:100 900;font-display:swap}
:root{color-scheme:light;--bg:#fbf9f5;--surface:#f5f2ec;--ink:#201e23;--muted:#67616b;--line:rgba(45,40,50,.185);--focus:#655a96;--raised:#fffdf8;font:14px/1.55 'Schibsted Grotesk','Segoe UI',sans-serif;color:var(--ink);background:var(--bg)}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);background:var(--bg)}body.dark{color-scheme:dark;--bg:#100e14;--surface:#19161e;--ink:#f6f2ea;--muted:#aca69d;--line:rgba(244,237,222,.195);--focus:#9b8de0;--raised:#211d27}button,input,select,textarea{font:inherit;color:inherit}button{min-height:44px;padding:9px 15px;border:1px solid var(--line);border-radius:8px;background:var(--raised);cursor:pointer}button:hover{background:var(--surface)}button.primary{background:var(--ink);color:var(--bg)}button:disabled{opacity:.6;cursor:not-allowed}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--focus);outline-offset:3px}header,nav{padding:16px 28px;border-bottom:1px solid var(--line)}nav{display:flex;gap:28px;color:var(--muted)}nav strong{color:var(--ink)}main{padding:24px 28px;max-width:1100px;margin:auto}h1{font-size:23px;letter-spacing:-.02em;margin:12px 0 4px}h2{font-size:17px;margin:20px 0 8px}p{max-width:70ch;margin:6px 0 16px}.muted,small{color:var(--muted)}.tools{display:flex;flex-wrap:wrap;gap:12px;padding:12px 28px;background:var(--surface);border-bottom:1px solid var(--line)}.tools label{display:flex;gap:10px;align-items:center}.bar,.actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.bar{justify-content:space-between;margin:20px 0}.rows{border-top:1px solid var(--line)}.row{display:flex;gap:20px;align-items:center;border-bottom:1px solid var(--line);padding:18px 0}.grow{flex:1;min-width:0}.row strong{display:block}.state{font-size:12px;border:1px solid var(--line);padding:4px 8px;border-radius:6px}.notice{padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:8px;margin:18px 0}label{display:block;font-weight:550;margin-bottom:6px}input,select,textarea{max-width:100%;width:100%;padding:10px 12px;min-height:44px;background:var(--bg);border:1px solid var(--line);border-radius:6px}textarea{min-height:140px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.full{grid-column:1/-1}article{margin:20px 0;border-block:1px solid var(--line);padding:20px 0;white-space:pre-wrap;overflow-wrap:anywhere;max-width:70ch}.facts{display:grid;grid-template-columns:130px 1fr;gap:10px;margin:18px 0}.facts dt{color:var(--muted)}.facts dd{margin:0;overflow-wrap:anywhere}a{color:inherit;text-underline-offset:3px}.path{font-size:12px;margin-left:auto}.review{margin-top:32px;border-top:1px solid var(--line);padding-top:18px}output{display:block}.hidden{display:none}input[type=checkbox]{width:auto;min-height:auto}@media(max-width:600px){header,nav,main,.tools{padding-inline:16px}.row{align-items:flex-start;flex-wrap:wrap;gap:12px}.grid{grid-template-columns:1fr}.facts{grid-template-columns:1fr;gap:4px}.facts dd{margin-bottom:10px}nav{gap:18px;flex-wrap:wrap}.row .actions{width:100%}h1{font-size:21px}.tools label{width:100%}.path{margin-left:0}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style><div class="tools" aria-label="Prototype review controls"><strong>PROTOTYPE — simulated records and writes</strong><label>Scenario <select id="scenario"><option value="normal">Normal</option><option value="empty">Empty</option><option value="denied">No publisher access</option><option value="offline">Read unavailable</option><option value="conflict">Source changed before save</option><option value="unknown">Lost acknowledgement</option><option value="expired">Offer expired</option></select></label><button id="reference">Open linked source</button><label>Reference <select id="reference-state"><option value="found">Current source</option><option value="loading">Loading</option><option value="missing">Missing or foreign</option><option value="invalid">Malformed</option><option value="deferred">Current review unfinished</option></select></label><button id="theme">Change theme</button><button id="scope">Switch business</button><span class="path" id="path"></span></div><header><strong>Clients</strong></header><nav>People <span>Conversations</span><span>Calendar</span><strong>Portal</strong></nav><main id="app" aria-live="polite"></main><script>
let linked=false,referenceState='found';let step='list',published=false,shared=false,withdrawn=false,stale=false,version=1,scope=1,decision='',data={title:'Welcome FAQ',content:'Our introductory session lasts 30 minutes. You can reschedule from Sessions up to 24 hours before the appointment.',kind:'faq',from:'',until:''};let scenario='normal';const app=document.querySelector('#app');const esc=s=>String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));function button(label,action,primary=false){return '<button '+(primary?'class="primary" ':'')+'data-action="'+action+'">'+label+'</button>'}function render(){document.querySelector('#path').textContent='Business '+scope+' / '+step;let content='';const back=button('Back to experience','exit');if(step==='reference'){content=back+'<h1>Teach CURA</h1>'+(referenceState==='loading'?'<p role="status">Checking the linked source in this business…</p>'+button('Finish read','reference-done'):referenceState==='missing'||referenceState==='invalid'?'<p role="alert">The linked source is not available in this business. No other source has been opened.</p>'+button('Show all sources','reference-clear'):referenceState==='deferred'?'<p role="status">Finish or close your current review before opening another source.</p>'+button('Return to current review','publication-review')+button('Close review and open source','reference-done'):'<p>Showing the linked source. It remains private until you publish and approve customer sharing.</p><div class="rows"><div class="row"><div class="grow"><strong>'+esc(data.title)+'</strong><small>Saved version '+version+' · '+(published?'Prepared':'Review the source first')+'</small></div>'+button('Review or correct','source',true)+'</div></div>'+button('Show all sources','reference-clear'))}else if(step==='exit'){content='<h1>Portal experience</h1><p class="muted">The existing Portal tab stays in place.</p>'+button('Teach CURA','list',true)}else if(scenario==='denied'){content=back+'<h1>Teach CURA</h1><div class="notice" role="alert">Only an authorized publisher can change the customer Knowledge for this business.</div>'}else if(scenario==='offline'){content=back+'<h1>Teach CURA</h1><div class="notice" role="alert">Knowledge could not be checked. Reconnect, then reload before changing it.</div>'+button('Retry read','retry')}else if(step==='list'){content=back+'<div class="bar"><div><h1>Teach CURA</h1><p class="muted">Choose what CURA can explain to your customers.</p></div>'+button('Add Knowledge','new',true)+'</div><label for="search">Find a source</label><input id="search" type="search" placeholder="Source title"><div class="rows">'+(scenario==='empty'?'<p class="muted">Add and review your first answer. It stays private until you share its approved version.</p>':'<div class="row"><div class="grow"><strong>'+esc(data.title)+'</strong><small>Saved version '+version+' · '+(published?'Prepared':'Needs publication')+'</small></div><span class="state">'+(scenario==='expired'?'Expired':withdrawn?'Withdrawn':stale?'Review needed':shared?(data.from&&new Date(data.from)>new Date()?'Scheduled':'Shared with customers'):'Private')+'</span><div class="actions">'+button('Review source','source')+(shared?button('Retire','retire'):'')+'</div></div>')+'</div>'}else if(step==='new'){content=button('Back to sources','list')+'<h1>Add a customer answer</h1><p class="muted">Use the existing Knowledge review flow. New material remains private.</p><label for="title">Title</label><input id="title" value="'+esc(data.title)+'"><label for="content">Approved wording</label><textarea id="content">'+esc(data.content)+'</textarea><div class="actions">'+button('Review text','publication-review',true)+button('Cancel','list')+'</div>'}else if(step==='source'||step==='publication-review'){content=button('Back to sources','list')+'<h1>'+esc(data.title)+'</h1><p class="muted">Original Knowledge · saved version '+version+'</p><article>'+esc(data.content)+'</article>'+(step==='publication-review'?'<p>Publish this exact reviewed text to your private Knowledge. Customer sharing is a separate choice.</p><div class="actions">'+button('Publish reviewed text','publish',true)+button('Make changes','new')+button('Cancel','list')+'</div>':(published?'<p>This approved version is prepared. Choose its customer audience and dates.</p>'+button('Review customer sharing','terms',true)+button('Correct source','new'):'<p>This source needs the existing reviewed-publication step before business-wide sharing.</p>'+button('Prepare for customers','new',true)))}else if(step==='terms'){content=button('Back to source','source')+'<h1>Customer sharing</h1><p>'+esc(data.title)+' · approved version '+version+'</p><div class="grid"><div><label for="audience">Audience</label><select id="audience"><option>Customers of this business</option></select></div><div><label for="kind">Material type</label><select id="kind">'+['faq','information','offer','promotion','policy','campaign_explainer'].map(k=>'<option '+(k===data.kind?'selected':'')+'>'+k+'</option>').join('')+'</select></div><div><label for="from">Starts (optional)</label><input id="from" type="datetime-local" value="'+esc(data.from)+'"></div><div><label for="until">Ends (optional)</label><input id="until" type="datetime-local" value="'+esc(data.until)+'"></div></div><p class="muted">Customers still need active access to this business. Dates limit when CURA may use this version.</p><div class="actions">'+button('Review sharing','share-review',true)+button('Cancel','list')+'</div>'}else if(step==='share-review'){content=button('Back to dates','terms')+'<h1>Approve customer Knowledge</h1><dl class="facts"><dt>Source</dt><dd>'+esc(data.title)+' · version '+version+'</dd><dt>Audience</dt><dd>Customers of this business</dd><dt>Type</dt><dd>'+esc(data.kind)+'</dd><dt>Starts</dt><dd>'+esc(data.from||'When shared')+'</dd><dt>Ends</dt><dd>'+esc(data.until||'Until withdrawn or changed')+'</dd></dl><article>'+esc(data.content)+'</article><p>The saved version becomes available to these customers and CURA. Internal Knowledge stays private. Later changes require another review.</p><div class="actions">'+button('Share approved version','share',true)+button('Cancel','list')+'</div>'}else if(step==='retire'){content=button('Back to sources','list')+'<h1>Retire this customer source?</h1><p>Future access to this version stops. The original Knowledge and private customer conversations are retained.</p><div class="actions">'+button('Keep sharing','list')+button('Confirm withdrawal','withdraw')+'</div>'}else if(step==='unknown'){content='<h1>Check the saved result</h1><div class="notice" role="alert">The response was interrupted. This change may already be saved. Check its original receipt before making another change.</div>'+button('Check saved status','recover',true)}else if(step==='conflict'){content='<h1>Source changed</h1><div class="notice" role="alert">The saved source no longer matches this review. Nothing was shared by this attempt.</div>'+button('Read current source','source',true)+button('Cancel','list')}else if(step==='saved'){content='<h1>'+ (withdrawn?'Customer access withdrawn':shared?'Customer sharing recorded':'Private publication verified')+'</h1><p>'+ (withdrawn?'CURA can no longer retrieve this source for future answers.':shared?'The original version, audience and receipt match the saved result.':'The exact reviewed generation is saved. Choose customer sharing separately.')+'</p><small>Simulated native receipt readback. No actual publication or share occurred.</small><div class="actions">'+button(shared||withdrawn?'Return to sources':'Choose customer sharing',shared||withdrawn?'list':'terms',true)+'</div>'}app.innerHTML=content+'<details class="review"><summary>Prototype notes and decision</summary><p>Local mock only. Source publication uses the existing Knowledge worker; sharing uses existing native prepare/set and canonical receipts. No external action, private data, native haptic or production proof. Inline detail preserves the existing shell. Focus moves to the changed heading; reduced motion has no spatial transition. Unknown state permits readback only.</p><div class="actions">'+button('Approve intent','approve')+button('Revise','revise')+button('Reject','reject')+'</div><label for="notes">Review notes</label><textarea id="notes"></textarea><output id="decision">'+esc(decision)+'</output></details>';app.querySelector('h1')?.setAttribute('tabindex','-1');app.querySelector('h1')?.focus({preventScroll:true});if(app.querySelector('#search'))app.querySelector('#search').oninput=e=>{app.querySelector('.row')?.classList.toggle('hidden',!data.title.toLowerCase().includes(e.target.value.toLowerCase()))}}
app.addEventListener('click',e=>{const action=e.target.closest('[data-action]')?.dataset.action;if(!action)return;if(['approve','revise','reject'].includes(action)){decision='Local review: '+action;document.querySelector('#decision').textContent=decision;return}if(action==='reference-done'){referenceState='found';step='reference'}else if(action==='reference-clear'){linked=false;step='list'}else if(action==='retry'){scenario='normal';document.querySelector('#scenario').value='normal';step='list'}else if(action==='publication-review'){if(!document.querySelector('#title').value.trim()||!document.querySelector('#content').value.trim()){alert('Add a title and wording.');return}data.title=document.querySelector('#title').value.trim();data.content=document.querySelector('#content').value;step=action}else if(action==='share-review'){data.kind=document.querySelector('#kind').value;data.from=document.querySelector('#from').value;data.until=document.querySelector('#until').value;if(data.from&&data.until&&data.until<=data.from){alert('The end must follow the start.');return}step=action}else if(action==='publish'){version++;stale=shared;shared=false;withdrawn=false;published=true;if(scenario==='empty'){scenario='normal';document.querySelector('#scenario').value='normal'}step=scenario==='unknown'?'unknown':'saved'}else if(action==='share'){if(scenario==='conflict')step='conflict';else{shared=true;withdrawn=false;stale=false;step=scenario==='unknown'?'unknown':'saved'}}else if(action==='recover'){step='saved'}else if(action==='withdraw'){shared=false;withdrawn=true;step='saved'}else step=action;render()});document.querySelector('#scenario').onchange=e=>{scenario=e.target.value;step='list';render()};document.querySelector('#reference').onclick=()=>{linked=true;referenceState=document.querySelector('#reference-state').value;step='reference';render()};document.querySelector('#theme').onclick=()=>document.body.classList.toggle('dark');document.querySelector('#scope').onclick=()=>{scope++;linked=false;referenceState='found';shared=false;published=false;withdrawn=false;stale=false;version=1;data={title:'Welcome FAQ',content:'This business offers an introductory session. Ask the team for current details.',kind:'faq',from:'',until:''};step='list';render()};render();
</script></html>
