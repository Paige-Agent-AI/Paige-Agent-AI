<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E04 exact-term effectuation prototype — synthetic</title>
<link rel="stylesheet" href="../../../src/solo/solo-tokens.css"><link rel="stylesheet" href="../../../src/solo/sales/collections/collections.css">
<style>
.prototype-page [hidden]{display:none!important}
html,body{margin:0;min-height:100%}.paige-solo.prototype-page{height:auto;min-height:100dvh;padding:24px}.prototype-main{max-width:900px;margin:auto}.prototype-controls{display:flex;flex-wrap:wrap;gap:12px;margin:14px 0}.prototype-controls label{display:flex;align-items:center;gap:8px}.prototype-controls select{min-height:44px;font:inherit;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px}.prototype-record{padding:24px;background:var(--surface);border:1px solid var(--line);border-radius:12px}.prototype-record p{margin:12px 0}.prototype-page h1{font-size:22px;margin:0 0 16px}.prototype-page h2{font-size:20px}.prototype-page small{color:var(--ink-2)}.prototype-page .btn{height:auto;min-height:44px;white-space:normal}.prototype-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.paige-solo.prototype-effectuation-dialog{width:calc(100vw - 32px);max-width:600px;max-height:calc(100dvh - 32px);margin:auto;height:auto;padding:24px;overflow:auto;animation:none}.prototype-effectuation-dialog::backdrop{background:rgb(0 0 0/.65)}.prototype-effectuation-dialog h2{margin-bottom:14px}.prototype-effectuation-dialog p{line-height:1.65;margin:12px 0}.prototype-facts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px 16px;margin:18px 0}.prototype-facts dd{margin:0;overflow-wrap:anywhere}.prototype-facts dt{color:var(--ink-2)}.prototype-page button:focus-visible,.prototype-page select:focus-visible{outline:2px solid var(--violet);outline-offset:3px}@media(max-width:480px){.paige-solo.prototype-page{padding:14px 12px}.prototype-record{padding:18px}.paige-solo.prototype-effectuation-dialog{padding:18px}.prototype-facts{grid-template-columns:minmax(0,1fr)}.prototype-facts dd{margin-top:-6px}}@media(prefers-reduced-motion:reduce){.prototype-page *{animation:none!important;transition:none!important}}
</style>
<body class="paige-solo prototype-page" data-theme="light"><main class="prototype-main"><p><small>Synthetic interaction prototype · no authentication, signatures, commercial writes or provider actions</small></p><div class="prototype-controls"><label>Theme <select id="theme" aria-label="Theme"><option>light</option><option>dark</option></select></label><label>State <select id="mode" aria-label="State"><option value="valid">Matching signed terms</option><option value="changed">Current terms changed</option><option value="missing">Incomplete commercial start</option><option value="denied">Role revoked during review</option><option value="off">Capability unavailable</option><option value="unknown">Uncertain response</option><option value="receipt_failed">Receipt transaction refused</option><option value="recorded">Already recorded</option></select></label></div>
<section class="prototype-record" id="invoice"><h1>Invoice record</h1><p>Accepted contract principal: $3,500.00 · Payment terms version3</p><p id="current">Commercial terms: draft</p><p id="receipt" role="status"></p><div class="prototype-actions"><button class="btn" id="read">Review accepted agreement</button><button class="btn" id="effect">Review making terms effective</button><button class="btn" id="refresh">Refresh current record</button></div></section>
<dialog class="paige-solo sc-command-dialog prototype-effectuation-dialog" aria-labelledby="heading"><h2 id="heading" tabindex="-1">Review making terms effective</h2><div id="content"></div><p id="notice" role="status"></p><div class="prototype-actions"><button id="primary" class="sc-primary">Prepare review</button><button id="cancel">Cancel</button></div></dialog></main>
<script>
const modal=document.querySelector('dialog'),mode=document.querySelector('#mode'),content=document.querySelector('#content'),notice=document.querySelector('#notice'),primary=document.querySelector('#primary'),cancel=document.querySelector('#cancel');let phase='prepare',recorded=false,writes=0,opener=null;
const messages={changed:'Current commercial terms changed after the agreement was prepared. Review the accepted record and obtain a matching agreement before making these terms effective.',missing:'A commercial start date is missing. Record complete terms and obtain the matching approved signatures; a payment date cannot supply the missing service start.',denied:'This action is unavailable with your current workspace role. Check access before trying again.',off:'This governed capability is unavailable. The agreement and its terms remain unchanged.'};
function current(){document.querySelector('#current').textContent=recorded?'Commercial terms: active · accepted version3':'Commercial terms: draft';document.querySelector('#receipt').textContent=recorded?'Effective terms recorded against signing version4. No payment or service completion is confirmed.':'';document.querySelector('#effect').hidden=recorded;}
function text(value){const p=document.createElement('p');p.textContent=value;content.append(p);}
function show(){content.replaceChildren();notice.textContent='';cancel.disabled=false;primary.disabled=false;primary.hidden=false;primary.textContent='Prepare review';if(phase==='document'){document.querySelector('#heading').textContent='Accepted agreement record';text('Original retained service responsibilities. Principal USD3,500.00, deposit USD500.00 and ten monthly obligations of USD300.00. This is a synthetic retained-document preview.');primary.hidden=true;cancel.textContent='Back to invoice';return;}document.querySelector('#heading').textContent='Review making terms effective';cancel.textContent='Cancel';text('Making the matching commercial terms effective is a separate approved business action. It does not issue an invoice, request a payment or start delivery.');if(phase==='ready'||phase==='unknown'){const dl=document.createElement('dl');dl.className='prototype-facts';for(const [label,value]of [['Client','Example client'],['Agreement','Service agreement · signing version4'],['Accepted payment terms','Version3 · USD3,500.00'],['Commercial start','2026-10-15'],['Result','Draft terms become active']]){const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=label;dd.textContent=value;dl.append(dt,dd);}content.append(dl);primary.textContent=phase==='unknown'?'Recover original operation':'Approve action';if(phase==='unknown'){notice.textContent='The response is uncertain. Recover this original operation before starting another.';cancel.disabled=true;}}}
function open(documentOnly=false){phase=documentOnly?'document':'prepare';opener=document.activeElement;show();modal.dataset.theme=document.body.dataset.theme;modal.showModal();document.querySelector('#heading').focus();}
document.querySelector('#read').onclick=()=>open(true);document.querySelector('#effect').onclick=()=>open(false);document.querySelector('#refresh').onclick=()=>current();cancel.onclick=()=>modal.close();modal.oncancel=e=>{if(phase==='unknown')e.preventDefault();};modal.onclose=()=>{(opener?.hidden?document.querySelector('#read'):opener)?.focus();};
primary.onclick=()=>{if(phase==='prepare'){if(messages[mode.value]){notice.textContent=messages[mode.value];notice.role='alert';return;}phase='ready';show();notice.textContent='The retained signing record and current commercial revision match. Review these exact facts before approval.';return;}if(phase==='ready'){if(mode.value==='receipt_failed'){notice.textContent='The record and its receipt could not complete together. The transaction was refused; current terms remain unchanged.';notice.role='alert';primary.disabled=true;return;}recorded=true;writes++;if(mode.value==='unknown'){phase='unknown';show();return;}current();modal.close();return;}if(phase==='unknown'){current();modal.close();}};
mode.onchange=()=>{recorded=mode.value==='recorded';writes=recorded?1:0;current();};document.querySelector('#theme').onchange=e=>{document.body.dataset.theme=e.target.value;modal.dataset.theme=e.target.value;};window.effectuationPrototype={state:()=>({recorded,writes,phase})};current();
</script></body></html>
