const renderHuman=render;render=function(){renderHuman();if($('#content .cash-layout')&&V.view==='home'&&V.concept==='canvas')$('#content .heading').insertAdjacentHTML('afterend',riskSummary());if(V.concept==='desk'&&V.view==='home'&&V.role!=='denied'&&['populated','stale'].includes(V.state))$('#content .sampleband')?.insertAdjacentHTML('afterend','<div class="financial-bearings"><span>Cash <b>$184,600</b></span><span>September profit <b>$26,000</b></span><span>Outstanding <b>$62,400</b></span></div>');let slider=$('#receipt-delay');if(slider)slider.oninput=e=>{V.previewDelayWeeks=Number(e.target.value);slider.previousElementSibling.querySelector('b').textContent=V.previewDelayWeeks+' weeks';$('#receipt-preview-dates').textContent='Originally '+forecastDate(5)+'. Preview arrival '+forecastDate(5+V.previewDelayWeeks)+'.'};if(V.concept==='review'&&V.view==='home'&&innerWidth<=850&&$('#content .editorial')){const opening=document.createElement('div');opening.className='mobile-financial-opening';for(const selector of ['.heading','.editorial-title','.review-intro']){const el=$('#content .editorial '+selector);if(el)opening.append(el)}$('#content .review-layout').before(opening);}if(V.concept==='desk'&&V.view==='home'&&innerWidth<=850&&$('#content .selected-decision-brief'))$('#content .heading .controls').before($('#content .selected-decision-brief'));if($('#desk-choice'))$('#desk-choice').onchange=e=>{V.decision=Number(e.target.value);render()};scaleChartText();$('#refresh').disabled=V.state==='loading';$('#refresh').textContent=V.state==='loading'?'Loading…':'Refresh example';$('#freshness').textContent=V.loadedAt?'Sample loaded '+V.loadedAt+' ET':'Synthetic snapshots · Sep 30';};
const openHuman=open;open=function(title,body){openHuman(title,body);$('#dialog').className=title.startsWith('PAIGE')?'paige-drawer':title.includes('snapshot')||title.includes('statement')||title.includes('transaction')||title.includes('projection')?'evidence-drawer':'';scaleChartText($('#dialog'))};
document.addEventListener('click',e=>{const b=e.target.closest('[data-action],[data-zoom],[data-step]');if(!b)return;if(b.dataset.zoom&&V.plot){let v=V.plot.svg.viewBox.baseVal,z=b.dataset.zoom;if(z==='reset'){v.x=0;v.width=V.plot.initial.width;}else{const nw=Math.max(V.plot.initial.width/3,Math.min(V.plot.initial.width*1.5,v.width*(z==='in'?.8:1.25)));v.x+=(v.width-nw)/2;v.width=nw;}scaleChartText($('#dialog'));announce('Chart viewport '+z);return}if(b.dataset.step!==undefined){const i=Number(b.dataset.step);open('Review the accountable step',`<p>${i===0?'Nora Kim confirms the source period, amount and coverage.':i===1?'The standing Sales or Finance owner reviews the relevant source and returns evidence.':'Alex Morgan reviews the financial consequence and approves a bounded next step.'}</p><p class="muted">Synthetic responsibility only. No person is notified and no task is created.</p>`);return}switch(b.dataset.action){case 'immersive':openImmersive();break;case 'apply-delay':if(V.role==='viewer')return;V.delayWeeks=V.previewDelayWeeks??V.delayWeeks??4;V.scenario='delay';delete V.forecastPoint;render();break;case 'investigate-software':case 'software-detail':V.adviceContext={type:'transaction',row:tx[2]};open('Cloudstack · account investigation',`<span class="chip warn">Synthetic company</span><h3>$2,400 · September 27</h3><p>Software statement total: $8,400. Software budget: $7,000. This charge requires contract review; no duplicate or savings is assumed.</p><dl><dt>Accounting</dt><dd>September accrual expense</dd><dt>Bank activity</dt><dd>September 27 posting −$2,400</dd><dt>Responsibility</dt><dd>Nora Kim · synthetic finance lead</dd></dl><button data-action="ask-context">Explain this charge</button><button data-action="software-task" class="primary" ${V.role==='viewer'?'disabled':''}>Prepare vendor review</button>`);break;case 'software-task':if(V.role==='viewer')return;V.adviceContext={type:'spend'};V.draft={title:'Review Cloudstack against the software budget',scope:'Nora Kim reviews the $2,400 sample bill and contract, then returns an explanation of the $1,400 budget variance. No cancellations or accounting writebacks.',due:'2026-10-02'};draft();break;case 'dossier-task':if(V.role==='viewer')return;V.draft={title:decisions[V.decision].title,scope:'Nora Kim coordinates source review with the standing domain owner and returns a financial decision to Alex Morgan. No external messages, payments or bookkeeping edits.',due:$('#followup-date').value};draft();break;case 'dossier-question':V.adviceContext=null;whyBase();break;}});

const lineChartHuman=lineChart;lineChart=function(forecast=false,small=false){let html=lineChartHuman(forecast,small);if(forecast&&V.scenario!=='base'){const dims=html.match(/viewBox="0 0 ([0-9.]+) ([0-9.]+)"/),W=Number(dims[1]),H=Number(dims[2]),L=55,R=20,T=22,B=32,points=base.map((n,i)=>(L+i*(W-L-R)/12)+','+(T+(240000-n)*(H-T-B)/240000)).join(' ');html=html.replace('<polyline class="line', '<polyline fill="none" stroke="var(--chart-gold)" stroke-width="1.5" points="'+points+'"/><polyline class="line');html=html.replace('<div class="legend">','<div class="legend"><span><i></i>Base-case reference</span>');}return html;};


const financeTabs=[['home','Overview'],['bank','Banking & Cash'],['ar','Receivables'],['spend','Expenses & Payables'],['report','Profitability'],['cash','Budgeting & Forecasting'],['connections','Connections']];
const labels={operating:'Operating · 1042',reserve:'Tax & Opportunity Reserve',software:'Software & subscriptions',delivery:'Direct service costs'};
const originalWhyBase=whyBase;whyBase=function(){if(V.view==='ar')V.adviceContext={type:'ar'};else if(V.view==='spend')V.adviceContext={type:'spend'};else if(V.view==='connections')V.adviceContext={type:'readiness'};if(V.adviceContext&&['ar','spend','connections'].includes(V.view)){let c=V.adviceContext,a=sources[c.type];open('PAIGE · '+a[0],'<span class="chip purple">Context-linked synthetic analysis</span><p>'+esc(a[1])+'. '+esc(a[2].map(x=>x.replace('|',': ')).join('. '))+'</p><p>Inspect this source and prepare an internal review. No external financial action.</p><button data-action="prepare-context" class="primary" '+(V.role!=='owner'?'disabled':'')+'>Prepare source review</button>');return}return originalWhyBase()};
function arWorkspace(){return heading('Outstanding is not collected.','Sales evidence, brought into the financial picture.')+sampleBand()+`<div class="investigation-layout"><section><div class="review-intro"><div><span class="label">Open customer balances</span><b>$62,400</b><small>Historical · Sep 30</small></div><div><span class="label">Overdue balance</span><b>$44,000</b><small>No duplicate receivables engine</small></div></div><h2>Aging by due date</h2>${spendRows([['Current',18400],['1–30 days',32000],['31–60 days',12000]],62400)}<label for="arfilter">Show balances</label><select id="arfilter"><option value="all">All customers</option><option value="overdue">Overdue only</option><option value="current">Current only</option></select><div id="arrows"></div><h2 style="margin-top:28px">Settlement evidence stays distinct</h2><p class="muted">A captured payment, invoice allocation and bank deposit are separate records. Finance reads the verified chain from Sales.</p><button data-tx="0">Inspect $18,400 verified sample settlement</button></section><aside class="investigation-notebook"><div class="mark">${icon('spark')}<b>PAIGE</b></div><h2>Confirm Orion’s timing before relying on the cash.</h2><p>$32,000 is 18 days overdue at September close. No captured payment or deposit is recorded for this invoice.</p><button data-source="ar">Inspect the Sales source</button><button class="primary" data-fin="ar-task" ${V.role!=='owner'?'disabled':''}>Prepare Sales handoff</button><small>Internal review only. No customer message is sent.</small></aside></div>`}
function drawAR(){let f=$('#arfilter').value;$('#arrows').innerHTML=`<div class="report-scroll"><table class="statement"><thead><tr><th>Customer / Sales invoice</th><th>Outstanding</th><th>Due</th><th>Settlement</th></tr></thead><tbody>${[['Orion Design','SYN-1048',32000,'Sep 12','No capture','overdue'],['Cedar Strategy','SYN-1052',18400,'Oct 10','Not due','current'],['Atlas Partners','SYN-1033',12000,'Aug 20','No capture','overdue']].filter(x=>f==='all'||x[5]===f).map(x=>`<tr><td><button data-fin="invoice" data-customer="${x[0]}" data-amount="${x[2]}" data-invoice="${x[1]}" data-due="${x[3]}">${x[0]}</button><small style="display:block">${x[1]}</small></td><td>${money(x[2])}</td><td>${x[3]}</td><td>${x[4]}</td></tr>`).join('')}</tbody></table></div>`}
function bankWorkspace(){return heading('See the cash behind the books.','Posted activity, account evidence and reconciliation.')+sampleBand()+`<div class="cash-layout"><section><div class="review-intro"><div><span class="label">Available sample cash</span><b>$184,600</b><small>Historical snapshot · Sep 30</small></div><div><span class="label">Needs reconciliation review</span><b>1</b><small>Among seven selected entries</small></div></div><div class="account-strip">${[['operating',129600],['reserve',55000]].map(([k,n])=>`<button data-fin="bank-account" data-key="${k}"><span>${esc(labels[k])}</span><b>${money(n)}</b><small>Synthetic account · inspect evidence</small></button>`).join('')}</div><div class="panelhead"><h2>Cash movement</h2><button data-view="cash">Plan future cash</button></div>${lineChart(false)}<div class="transaction-tools"><input id="search" aria-label="Search transactions" placeholder="Search payee or source category" value="${esc(V.search)}"><select id="direction" aria-label="Money direction"><option value="all">All activity</option><option value="in" ${V.direction==='in'?'selected':''}>Money in</option><option value="out" ${V.direction==='out'?'selected':''}>Money out</option></select></div>${transactionTable()}</section><aside class="bank-recon"><div class="investigation-notebook"><div class="mark">${icon('spark')}<b>PAIGE · reconciliation</b></div><h2>Resolve the evidence gap.</h2><p>Cloudstack’s $2,400 posting needs bill and contract review. Matching this sample does not authorize a bookkeeping write.</p><button data-tx="2">Inspect unmatched activity</button><button data-fin="recon" ${V.role!=='owner'?'disabled':''}>Prepare reconciliation review</button></div></aside></div>`}
function connectionsWorkspace(){return heading('Bring the sources together.','Connection status and financial coverage are different things.')+sampleBand()+`<div class="connection-list">${[['QuickBooks','Accounting statements, chart of accounts, expenses','Sample connected · live activation unverified','Connected sample only'],['Banking / Plaid','Balances, bank activity and reconciliation evidence','Sample connected · live tenant scope unverified','Connected sample only'],['Sales','Invoices, allocations and verified settlement evidence','Canonical read boundary · synthetic projection','Read-only consumer']].map(([n,d,status,tag])=>`<section class="connection-row"><div><h2>${n}</h2><p>${d}</p><span class="chip">${tag}</span></div><div><p>${status}</p><button data-fin="connection" data-provider="${n}">Inspect coverage</button></div></section>`).join('')}</div><div class="investigation-layout" style="margin-top:32px"><section><h2>Your books keep their own names.</h2><p class="muted">Account names and category labels come from the company’s source. Analytical definitions remain traceable without renaming the books.</p><div class="report-scroll"><table class="statement"><thead><tr><th>Source account label</th><th>Financial meaning</th><th>Mapping</th></tr></thead><tbody>${[['operating','Cash asset'],['reserve','Cash asset'],['software','Operating expense'],['delivery','Cost of service']].map(([k,d])=>`<tr><td>${esc(labels[k])}</td><td>${d}</td><td><button data-fin="mapping" data-key="${k}">Review label</button></td></tr>`).join('')}</tbody></table></div></section><aside class="investigation-notebook"><div class="mark">${icon('spark')}<b>PAIGE · source quality</b></div><h2>Names are preserved. Meaning is checked.</h2><p>An unfamiliar account is an unresolved mapping until its meaning is established. PAIGE must withhold unsupported totals.</p><button data-source="readiness">Inspect retained source research</button></aside></div>`}
sources.cash[2].push('Account identities|Operating 1042 and Reserve 2088; source labels preserved');
const originalAccounts=accounts;accounts=()=>originalAccounts().replace('>Operating<','>'+esc(labels.operating)+'<').replace('>Reserve<','>'+esc(labels.reserve)+'<');
const oldExpense=expenseView;expenseView=function(){let html=oldExpense();let start=html.indexOf('<aside>');return html.slice(0,start)+`<aside class="expense-advice"><div class="investigation-notebook"><div class="mark">${icon('spark')}<b>PAIGE · expenses and obligations</b></div><h2>Explain the overspend. Check the due dates.</h2><p>Software is $1,400 above its $7,000 plan. Cloudstack’s $2,400 bill needs investigation; a duplicate is not proven.</p><button data-action="software-detail">Investigate the Cloudstack charge</button><h3 style="margin-top:24px">Next obligations</h3><p>$18,000 contractors due Oct 8 and $29,000 payroll due Oct 15. Confirm timing before changing commitments.</p><button data-source="bills">Inspect unpaid obligations</button><button class="primary" data-fin="payable" ${V.role!=='owner'?'disabled':''}>Prepare bill timing review</button><small>No bill payment or live categorization is authorized.</small></div></aside></div>`};
const fullBaseRender=render;footer=()=>'';V.concept='review';
render=function(){let view=V.view;V.concept=view==='cash'?'canvas':'review';fullBaseRender();$('#subtabs').innerHTML=financeTabs.map(([id,name])=>`<button data-view="${id}" class="${view===id?'active':''}" aria-current="${view===id?'page':'false'}">${name}</button>`).join('');if(['populated','stale'].includes(V.state)&&V.role!=='denied'){let html=view==='bank'?bankWorkspace():view==='ar'?arWorkspace():view==='connections'?connectionsWorkspace():null;if(html!==null)$('#content').innerHTML=html;if(view==='home')$('#content').insertAdjacentHTML('beforeend',`<section class="overview-decisions"><div class="panelhead"><h2>Decisions that deserve your attention</h2><button data-fin="dossier">Open decision desk</button></div>${decisions.map((d,i)=>`<button data-fin="dossier" data-index="${i}"><b>${d.title}</b><span>${d.summary}</span></button>`).join('')}</section>`);wire();if($('#arfilter')){$('#arfilter').onchange=drawAR;drawAR()}if(view==='spend')$('#content .panel')?.insertAdjacentHTML('beforeend',`<div class="evidencebar"><button data-action="software-detail">Investigate software</button><button data-fin="payable" ${V.role!=='owner'?'disabled':''}>Prepare bill review</button></div>`);if(view==='report')$('#content').insertAdjacentHTML('beforeend',`<div class="panelhead"><p class="muted">Source account labels are preserved; calculated financial subtotals retain their definitions.</p><button data-view="connections">Inspect account mapping</button></div>`);document.querySelectorAll('#content h3,#content td,#content .account').forEach(el=>{if(el.children.length===0){if(el.textContent==='Software & subscriptions')el.textContent=labels.software;if(el.textContent==='Direct service costs')el.textContent=labels.delivery;}})}if(view==='bank'&&innerWidth<=850){const rail=$('#content .bank-recon');$('#content .account-strip')?.after(rail)}if(view==='spend'){$('#content .cash-layout').style.alignItems='start'}scaleChartText();$('#subtabs .active')?.scrollIntoView({block:'nearest',inline:'nearest'});history.replaceState(null,'','#'+view)};
document.addEventListener('click',e=>{let b=e.target.closest('[data-fin]');if(!b)return;let a=b.dataset.fin;if(a==='invoice'){V.adviceContext={type:'ar'};open(b.dataset.customer+' · '+b.dataset.invoice,`<span class="chip warn">Synthetic Sales record</span><h3>${money(Number(b.dataset.amount))} outstanding</h3><p>Due ${b.dataset.due} · snapshot Sep 30, 2026. Finance reads this record; Sales owns invoicing and collection.</p><p>No captured payment or verified deposit is recorded for this balance.</p><button data-action="ask-context">Ask PAIGE about this balance</button>`)}else if(a==='bank-account'){open(labels[b.dataset.key]+' · source evidence',`<span class="chip warn">Synthetic bank snapshot</span><h3>${b.dataset.key==='operating'?'$129,600':'$55,000'}</h3><p>Account label ${esc(labels[b.dataset.key])} preserved from the fictional company. Account identifier ${b.dataset.key==='operating'?'1042':'2088'}. Sep 30 historical available and posted balances are equal in this fixture; real holds and freshness require provider evidence.</p><button data-source="cash-sep">Inspect balance bridge</button>`)}else if(a==='connection'){open(b.dataset.provider+' · coverage',`<span class="chip warn">Prototype connection only</span><p>No live company is connected. ${b.dataset.provider==='QuickBooks'?'Actual QuickBooks readiness remains unverified; use existing integration activation ownership.':'Live permission, workspace scope and synchronization require source verification.'}</p><dl><dt>Sample period</dt><dd>September 2026</dd><dt>Financial coverage</dt><dd>Complete deterministic fixture</dd><dt>Labels</dt><dd>Source names preserved; uncertain classifications require review</dd></dl><button data-source="readiness">Inspect source readiness</button>`)}else if(a==='mapping'){let k=b.dataset.key;open('Review source label',`<p>This changes only the synthetic company label. It never renames a real account.</p><label for="source-label">Company’s account name</label><input id="source-label" maxlength="100" value="${esc(labels[k])}" ${V.role!=='owner'?'disabled':''}><p id="label-error" role="alert"></p><button class="primary" data-fin="save-label" data-key="${k}" ${V.role!=='owner'?'disabled':''}>Apply sample label</button>`)}else if(a==='save-label'){if(V.role!=='owner')return;let n=$('#source-label').value.trim();if(!n){$('#label-error').textContent='Enter an account name.';return}labels[b.dataset.key]=n;close();render();toast('Company label preserved in this local sample.')}else if(a==='dossier'){V.decision=Number(b.dataset.index||0);open('Decision dossier',dossier());$('#dialog').className='evidence-drawer';}else if(['ar-task','recon','payable'].includes(a)){if(V.role!=='owner')return;V.adviceContext={type:a==='ar-task'?'ar':a==='payable'?'bills':'spend'};V.draft={title:a==='ar-task'?'Confirm overdue collection timing with Sales':a==='recon'?'Review Cloudstack reconciliation evidence':'Review upcoming contractor and payroll obligations',scope:'Inspect source evidence with the standing domain owner. No external messages, payments, transfers or accounting edits.',due:'2026-10-02'};draft()}});
let initial=location.hash.slice(1);V.view=financeTabs.some(x=>x[0]===initial)?initial:'home';

$('#refresh').onclick=()=>freshLoad(true);$('#theme').onchange=e=>{document.body.dataset.theme=e.target.value;render()};$('#palette').onchange=e=>{document.body.dataset.palette=e.target.value;render()};window.addEventListener('resize',()=>scaleChartText());freshLoad();
