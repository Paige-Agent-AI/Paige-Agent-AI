<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sales payment flow — internal prototype</title><style>
:root{--surface:#fcfaf7;--paper:#fff;--ink:#182139;--muted:#525c74;--line:#d9d3e5;--accent:#5038bf;--tint:#eeebfb;--ring:#6750dc}*{box-sizing:border-box}body{margin:0;background:var(--surface);color:var(--ink);font:16px/1.55 system-ui}main{max-width:960px;margin:auto;padding:32px 24px}h1{font-size:28px;line-height:1.15;letter-spacing:-.025em}h2{font-size:20px;margin:24px 0 12px}p{max-width:68ch}label{display:block;margin:16px 0}select,input,button{font:inherit;min-height:44px;border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--paper);color:var(--ink)}select,input{display:block;width:100%;max-width:460px;margin-top:6px}button{cursor:pointer}button:hover{background:var(--tint)}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--ring);outline-offset:3px}button.primary{background:var(--accent);color:white;border-color:var(--accent)}button:disabled{opacity:.6;cursor:default}dl{display:grid;grid-template-columns:1fr auto;gap:10px 24px;max-width:560px;font-variant-numeric:tabular-nums}dd{margin:0;font-weight:600}section{border-top:1px solid var(--line);margin-top:24px;padding-top:8px}.notice{padding:16px;background:var(--tint);border-radius:12px}.muted{color:var(--muted)}::selection{background:var(--tint)}@media(max-width:600px){main{padding:20px 16px}dl{gap:8px 12px}button{width:100%;margin-bottom:8px}}</style><main><h1>Invoice payments</h1><p class="muted">Internal interaction prototype. All amounts and states below are illustrative; no provider request or payment is made.</p><label>Explore a state<select id="state"><option value="prepare">Prepare request</option><option value="review">Exact approval</option><option value="customer_action_required">Customer action required</option><option value="provider_accepted">Confirming payment</option><option value="outcome_unknown">Status unknown</option><option value="settled">Partial payment confirmed</option><option value="full">Balance satisfied</option><option value="failed">Request refused</option><option value="expired">Request expired</option><option value="not_ready">Connection unavailable</option><option value="return">Customer return</option></select></label><div id="screen"></div></main><script>
const screen=document.getElementById('screen'),state=document.getElementById('state');const summary='<dl><dt>Invoice number</dt><dd>INV-0042</dd><dt>Invoice total</dt><dd>$3,500.00</dd><dt>Business-recorded payments</dt><dd>$0.00</dd><dt>Provider-confirmed payments</dt><dd id="confirmed">$0.00</dd><dt>Outstanding</dt><dd id="outstanding">$3,500.00</dd></dl>';
function render(){let v=state.value;screen.innerHTML=summary;let content={prepare:'<section><h2>Request payment</h2><label>Amount to request (USD)<input inputmode="decimal" value="500.00"></label><p>The customer pays securely through your connected Stripe account. No payment is recorded when this request is created.</p><button class="primary" data-next="review">Prepare exact review</button><button data-next="prepare">Cancel</button></section>',review:'<section><h2>Review payment request</h2><dl><dt>Customer</dt><dd>Example client</dd><dt>Requested amount</dt><dd>$500.00</dd><dt>Provider</dt><dd>Stripe · business account</dd></dl><p>Request $500.00 against INV-0042. This creates a secure payment link; it does not charge or record payment.</p><button class="primary" data-next="customer_action_required">Approve payment request</button><button data-next="prepare">Back to amount</button></section>',customer_action_required:'<section><h2>Customer action required</h2><p>A $500.00 payment request is ready. The customer must complete payment with Stripe.</p><button>Copy secure payment link (prototype)</button><button data-next="provider_accepted">Check this payment</button></section>',provider_accepted:'<section><h2>Payment is being confirmed</h2><p>Payment has not yet been confirmed. The outstanding balance stays unchanged until confirmation.</p><button data-next="settled">Check this payment</button></section>',outcome_unknown:'<section><h2>We could not confirm the payment yet</h2><p>PAIGE will check this same request with the provider. Do not create another request while its result is unknown.</p><button data-next="provider_accepted">Check this payment</button></section>',settled:'<section><h2>Payment confirmed</h2><p>$500.00 has been applied to this invoice. $3,000.00 remains outstanding.</p><button data-next="prepare">Request another payment</button></section>',full:'<section><h2>Balance satisfied</h2><p>No payment remains due for this invoice. Collections should no longer pursue it.</p></section>',failed:'<section><h2>Payment request could not be created</h2><p>No payment was recorded. Check the business’s payment connection, then prepare a fresh review.</p><button data-next="not_ready">Inspect readiness</button></section>',expired:'<section><h2>Payment request expired</h2><p>This payment link is no longer available. No payment was confirmed.</p><button data-next="prepare">Prepare a new request</button></section>',not_ready:'<section><h2>Payment connection unavailable</h2><p>Connect and verify the business’s merchant account before requesting payment. Manual received-payment records remain available.</p></section>',return:'<section><h2>Check your invoice for the latest balance</h2><p>If you completed payment, the business will confirm it with the payment provider. You may close this page.</p><p class="muted">This page does not display or infer payment success.</p></section>'}[v];screen.innerHTML+=content;if(v==='settled'||v==='full'){document.getElementById('confirmed').textContent=v==='full'?'$3,500.00':'$500.00';document.getElementById('outstanding').textContent=v==='full'?'$0.00':'$3,000.00';}screen.querySelectorAll('[data-next]').forEach(b=>b.onclick=()=>{state.value=b.dataset.next;render();});}state.onchange=render;render();</script></html>
