    <!-- Privacy-friendly analytics by Plausible. Loaded from script, not static tags, so it can be
         skipped on /render-frame: that machine surface (paige-browser screenshots of unpublished
         drafts) exposes the draft as window.__PAIGE_RENDER_PAYLOAD__, and no third-party script may
         run beside it. src/main.tsx skips Sentry/PostHog on the same route. -->
    <script>
      (function () {
        if (/^\/render-frame(?:\/|$)/i.test(window.location.pathname)) return;
        var tracker = document.createElement("script");
        tracker.defer = true;
        tracker.setAttribute("data-domain", "paigeagent.ai");
        tracker.src = "https://plausible.io/js/script.js";
        document.head.appendChild(tracker);
        var pa = document.createElement("script");
        pa.async = true;
        pa.src = "https://plausible.io/js/pa-6X7R-SykdBdjPO8QpOaQD.js";
        document.head.appendChild(pa);
      })();
    </script>
    <script>
      window.plausible = window.plausible || function () {
        (window.plausible.q = window.plausible.q || []).push(arguments);
      };
      window.plausible.init = window.plausible.init || function (options) {
        window.plausible.o = options || {};
      };
      window.plausible.init();
    </script>

    <!-- Cinematic pre-hydration splash — paints before React boots so there
         is no white flash on load. Removed by src/main.tsx once the app mounts. -->
    <style>
      #paige-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 40px;
        background: radial-gradient(85% 65% at 50% 42%, #1a1033 0%, #0b0818 58%, #07040d 100%);
        transition: opacity 0.7s ease, visibility 0.7s ease;
        perspective: 720px;
      }
      #paige-splash.paige-splash--done {
        opacity: 0;
        visibility: hidden;
      }
      .psx-stage {
        position: relative;
        width: 210px;
        height: 210px;
        display: grid;
        place-items: center;
        transform-style: preserve-3d;
        animation: psxIn 1s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      /* The mark itself is mounted from src/components/brand/PaigeCommandMark.tsx by boot-splash.tsx.
         index.html owns only splash layout, never a second hand-drawn brand asset. */
      .psx-command-mark {
        width: 132px;
        height: 132px;
      }
      .psx-word {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        font-family: "Bricolage Grotesque", "Space Grotesk", system-ui, sans-serif;
        font-weight: 700;
        letter-spacing: 0.5em;
        font-size: 15px;
        color: #f3ecff;
        text-transform: uppercase;
        padding-left: 0.5em;
        animation: psxFadeUp 0.9s ease 0.35s both;
      }
      .psx-word i {
        display: block;
        height: 1.5px;
        width: 56px;
        background: linear-gradient(90deg, transparent, #d4af37, transparent);
        animation: psxLine 0.9s ease 0.55s both;
      }
      @keyframes psxIn { from { opacity: 0; transform: scale(0.82); } to { opacity: 1; transform: scale(1); } }
      @keyframes psxFadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
      @keyframes psxLine { from { width: 0; opacity: 0; } to { width: 56px; opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        #paige-splash { transition: none !important; }
        .psx-stage, .psx-word, .psx-word i { animation: none !important; }
      }
    </style>
  </head>

  <body>
    <div id="paige-splash" role="status" aria-label="Loading">
      <div class="psx-stage">
        <div id="paige-splash-mark" data-theme="dark"></div>
      </div>
      <div class="psx-word">Paige<i></i></div>
    </div>
    <script>
      // Tenant-facing public pages (a coach's booking page) must NOT show the
      // Paige-branded boot splash — their customers shouldn't meet our brand on
      // the way in. Strip the branding to a quiet neutral cover (kept in place
      // so the SEO marketing markup in #root never flashes) for a fast, dull
      // transition into the tenant's own booking card. Marketing + app keep the
      // cinematic splash. Runs synchronously before first paint.
      (function () {
        if (/^\/(book|booking)(\/|$)/.test(window.location.pathname)) {
          var el = document.getElementById("paige-splash");
          if (el) {
            el.innerHTML = "";
            el.style.background = "#F4F5F7";
            el.style.gap = "0";
            el.style.perspective = "none";
            el.setAttribute("aria-label", "Loading");
          }
        }
      })();
    </script>
    <div id="root">
      <!--
        Static SEO / no-JS fallback for crawlers that do not execute JavaScript.
        §18 ONE HOME (Task #126, owner-ruled 2026-08-12): this skeleton carries ONLY stable,
        SEO-legitimate copy that does NOT change with product decisions — the hero H1, one
        value-prop paragraph, and one primary CTA. Everything product-decision-driven (pricing
        tiers, feature matrix, security specifics, waitlist copy) lives in React ALONE and must
        NEVER be duplicated here — duplication is exactly what let a prior pricing PR leave this
        block stale (a headless reader / crawler saw retired pricing). The `lint:skeleton` CI
        guard fails the build if any non-whitelisted text appears inside #root, so the leak class
        cannot recur. React (createRoot, not hydrate) CLEARS #root on first commit, so this
        content is replaced by the live app for JS visitors and is seen only by no-JS crawlers.
      -->
      <main style="font-family:system-ui,-apple-system,sans-serif;background:#0b0710;color:#fff;padding:40px 24px;max-width:760px;margin:0 auto;">
        <h1 style="font-size:42px;font-weight:800;line-height:1.15;margin-bottom:16px;color:#fff;">Paige</h1>
        <p style="font-size:18px;color:#d1d5db;line-height:1.6;margin-bottom:24px;">Your AI operations partner.</p>
        <a href="/auth?mode=signup&amp;plan=solo&amp;billing=monthly" style="display:inline-block;background:#CFAE70;color:#0a0e1a;font-weight:700;font-size:16px;padding:12px 24px;border-radius:8px;text-decoration:none;">Get started</a>
      </main>
    </div>
    <script type="module" src="/src/boot-splash.tsx"></script>
