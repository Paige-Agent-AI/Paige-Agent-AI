<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entry recovery prototype</title><style>body{margin:0;font:16px/1.5 system-ui;background:Canvas;color:CanvasText}aside{padding:16px;border-bottom:1px solid GrayText}main{margin:12vh auto;padding:24px;max-width:420px}h1{font-size:24px;margin:0 0 12px}button{font:inherit;padding:12px 20px;min-height:44px;cursor:pointer}p{margin:0 0 24px}</style><aside>Read-only prototype. Simulated downloads; no account or network.<br><button id="fail">Failed load</button> <button id="wait">Loading</button> <button id="dirty">Other work pending</button></aside><main id="view"></main><script>const view=document.querySelector('#view');const failure=()=>{view.innerHTML='<h1>This page couldn’t open</h1><p>Check your connection, then reload this page to try again.</p><button id="reload">Reload page</button>';document.querySelector('#reload').onclick=()=>{view.innerHTML='<h1>Original page resumes</h1><p>Simulation only. Existing sign-in and business permissions would still apply.</p>'}};document.querySelector('#fail').onclick=failure;document.querySelector('#wait').onclick=()=>view.innerHTML='<p role="status">Loading this page…</p>';document.querySelector('#dirty').onclick=()=>{failure();document.querySelector('#reload').disabled=true;view.insertAdjacentHTML('beforeend','<p role="status">Finish or save your other work before reloading.</p>')};failure();</script></html>
