  # §49 Wave A #170 — paige-dictate: press-to-talk DICTATION (mic → text) for the Paige composers.
  # A browser WebSocket streams PCM16 (linear16/16k) and receives interim+final transcript. Deepgram
  # Nova-3 STT is routed via the ONE STT home (_shared/stt-router.ts, §18/§34) — the SAME nova cell
  # paige-stt uses, just with browser opts { encoding:"linear16", sampleRate:16000, channels:1 }; no
  # rival Deepgram client, no fork.
  #
  # AUTH POSTURE — verify_jwt = FALSE, with in-function JWT validation (documented divergence, §13):
  # The #170 brief RECOMMENDED verify_jwt=true so the platform gateway enforces the JWT. But a BROWSER
  # WebSocket CANNOT set an Authorization header (the WS handshake has no header API), so the gateway's
  # verify_jwt — which reads that header — cannot be satisfied by a browser WS and would REJECT the
  # upgrade before the function runs. This is the repo's own settled conclusion: EVERY browser/webhook
  # WS edge fn here is verify_jwt=false (voice-twiml, paige-stt), and the now-deleted paige-voice-chat
  # authenticated its browser WS exactly this way (short-lived access token in a query param, validated
  # app-side). The phase2b privileged-function audit records the same: "WebSocket query-token
  # authentication requires application-level validation." So paige-dictate is verify_jwt=false and does
  # its OWN §9 gate in-function: it reads the caller's access token from the ?token= query param, calls
  # auth.getUser() to VERIFY it (invalid ⇒ close the socket, never open Deepgram), and derives the tenant
  # SERVER-SIDE via current_user_tenant_id() — NEVER a body/query tenantId. The §9 guarantee (identity +
  # tenant from the VERIFIED JWT, never client-supplied) is identical to the gateway path; only the
  # enforcement layer differs. The owner/integrator can reverse to verify_jwt=true IF the platform
  # gateway is later confirmed to accept the token via the WS subprotocol. The anon apikey the gateway
  # requires for a verify_jwt=false fn rides the ?apikey= query param (public key, standard).
  [functions.paige-dictate]
    verify_jwt = false

  # Systems Check runner (task #80, L2) — three flavor edge fns over the ONE core
  # (_shared/systems-check-runner.ts). Tenant is resolved from the VERIFIED JWT, never the body
  # (§9/§588). `change` keeps the default verify_jwt=true (declared here for clarity). `onboarding` is
  # verify_jwt=FALSE so the provisioning enqueue (a brand-new tenant with no user session — cron/service
  # caller presenting no Supabase user JWT) can reach it; it fails closed in-function to an internal-caller
  # gate (service-role bearer OR x-cron-token) OR a user/owner JWT (resolveTenantFromJwt, which does full
  # in-function JWT verification), exactly like systems-check-run-operator / -scheduled.
  [functions.systems-check-run-onboarding]
    verify_jwt = false
  # The operator may target a specific tenant via an owner-gated body.tenant_id (resolveTenantFromJwt).
  [functions.systems-check-run-change]
    verify_jwt = true
  # Scheduled flavor is CRON-invoked (the cron poster presents no Supabase JWT), so verify_jwt=false;
  # it fails closed in-function to an internal-caller gate — a service-role bearer OR a valid
  # x-cron-token (verify_cron_token) — exactly like comms-scheduled-drain / paige-action-worker.
  [functions.systems-check-run-scheduled]
    verify_jwt = false
  # Operator flavor (Wave S3, L3) — runs the scope='operator' catalog TENANT-LESS (§53). verify_jwt=false
  # so the hourly cron (no Supabase JWT) can reach it; it fails closed in-function to EITHER an
  # internal-caller gate (service-role bearer OR x-cron-token) OR an operator JWT (is_platform_operator()
  # — super_admin OR platform_admin, §53). Never a tenant JWT, never a body identity (§588).
  [functions.systems-check-run-operator]
    verify_jwt = false

  # Alerting evaluator (A2) — the 5-minute sweep that reads active rules, resolves the signals they
  # depend on, and WRITES FIRINGS (delivery is A3, via _shared/channel-adapters.ts). verify_jwt=false
  # so the pg_cron poster (which presents no Supabase JWT) can reach it; it fails closed in-function
  # to EITHER an internal-caller gate (service-role bearer OR x-cron-token) OR an operator JWT
  # (is_platform_operator() — super_admin OR platform_admin, §53) — reusing the SAME helpers as
  # systems-check-run-operator (§18). Never a tenant JWT, never a body identity (§588).
  [functions.alerting-evaluate]
    verify_jwt = false

  # Alerting delivery (A3) — drains pending paige_alert_firing rows and writes an operator
  # notification for each. verify_jwt=false so the pg_cron poster (no Supabase JWT) can reach
  # it; fails closed in-function to the SAME gates as alerting-evaluate — internal caller
  # (service-role bearer OR x-cron-token) OR an operator JWT (is_platform_operator(), §53).
  [functions.alerting-deliver]
    verify_jwt = false

  # alerting-rule-write (A5) — the ONE authority on whether a rule may be stored. Called by the
  # Fleet tab's authoring form (operator JWT) and, from A-Weave-2, by Paige via paige-mcp
  # (service-role) — one seam, two callers, never two write paths (§18). verify_jwt=false so the
  # headless service-role caller reaches it on the same terms as a browser; fails closed
  # in-function to the SAME gates as the rest of the substrate — internal caller (service-role
  # bearer OR x-cron-token) OR an operator JWT (is_platform_operator(), §53).
  [functions.alerting-rule-write]
    verify_jwt = false

  # security-canary-probe (§68) — the cross-tenant leak canary. It probes growth_forms/growth_pages
  # AS AN ANONYMOUS CALLER and logs the result; §68 then reads that log to decide what Paige may do
  # unwatched, so the probe is now load-bearing rather than diagnostic. verify_jwt=false so the
  # pg_cron poster (no Supabase JWT) reaches it; fails closed in-function to the SAME internal-caller
  # gate as the rest of the cron substrate (service-role bearer OR x-cron-token). It was previously
  # UNSCHEDULED and UNGATED — never invoked once, and open to anyone who knew the URL.
  [functions.security-canary-probe]
    verify_jwt = false

